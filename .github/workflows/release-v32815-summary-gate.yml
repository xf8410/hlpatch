name: Release v3.28.15 summary session gate

# v3.28.15 = v3.28.14 + the real crash fix found in the device logs.
#
# Device evidence (uma_predict.log tail, idling on the home screen):
#   [209] S:json            -> CRASH at step 209 sig=11 RECOVERED
#   [189] S:before_get_character -> CRASH at step 189 sig=11 RECOVERED   (repeats)
# read_summary walks a stale WorkSingleModeData whose Character is already freed.
# scripts/apply_v32815_summary_gate.py adds a class gate + active-run gate before
# get_Character, and extends the SIGSEGV cooldown 60s -> 600s.
# Toolchain pinned by rust-toolchain.toml.

on:
  workflow_dispatch:
  push:
    branches:
      - workbench/v32815-summary-crash
    paths:
      - .github/workflows/release-v32815-summary-gate.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.28.15 >/dev/null 2>&1; then
            echo 'v3.28.15 release already exists — refusing to overwrite'
            exit 1
          fi

      - name: Generate chain + badge + boot install + summary gate
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py
          python3 scripts/bump_plugin_version.py 3.27.23
          python3 scripts/apply_sigsegv_guard_v32723.py
          python3 scripts/apply_screen_mirror_frame_a.py
          python3 scripts/apply_factor_index_badge.py
          python3 scripts/apply_url_decode_utf8_fix.py
          python3 scripts/apply_pushloop_install_fix.py
          python3 scripts/apply_v32814_boot_install.py
          python3 scripts/apply_v32815_summary_gate.py
          python3 scripts/bump_plugin_version.py 3.28.15
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.28.15"
          grep -Fq 'version = "3.28.15"' hachimi_ura_plugin/Cargo.lock

      - name: Idempotency check (double apply => identical sha)
        run: |
          set -euo pipefail
          FIRST=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          python3 scripts/apply_factor_index_badge.py
          python3 scripts/apply_url_decode_utf8_fix.py
          python3 scripts/apply_pushloop_install_fix.py
          python3 scripts/apply_v32814_boot_install.py
          python3 scripts/apply_v32815_summary_gate.py
          SECOND=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST" = "$SECOND"

      - name: Qualification greps (gate + boot install + badge invariants)
        run: |
          set -euxo pipefail
          SRC=hachimi_ura_plugin/src/lib.rs
          MOD=hachimi_ura_plugin/src/factor_index_badge.rs
          echo "install_sites=$(grep -aFc 'factor_index_badge::install();' "$SRC" || true)"
          for s in \
            'mod factor_index_badge;' \
            '"/api/factor_index"' \
            'install_screen_mirror_hook' \
            'fn hl_ptr_mapped(' \
            'String::from_utf8_lossy(&out).into_owned()' \
            'v3.28.13: install hooks before breaking' \
            'v3.28.14: unconditional boot install' \
            'v3.28.15: training-session gate' \
            '"reason":"sm_klass_mismatch"' \
            '"reason":"no_active_run"' \
            'SIGSEGV_COOLDOWN_UNTIL.store(now + 600,'
          do grep -aFq "$s" "$SRC" || { echo "MISSING INVARIANT: $s"; exit 1; }
          done
          test "$(grep -aFc 'factor_index_badge::install();' "$SRC")" = "5"
          ! grep -aFq 'SIGSEGV_COOLDOWN_UNTIL.store(now + 60,' "$SRC"
          grep -aFq '/sdcard/Android/media/jp.co.cygames.umamusume/hachimi/uma_predict.log' "$SRC"
          grep -aFq 'fn(*mut c_void, usize, usize, usize) -> u128' "$MOD"
          ! grep -aFq 'set_text_hook' "$MOD"
          ! grep -aFq 'OFF_FACTOR_SELECT' "$MOD"

      - name: Setup Rust (toolchain pinned by rust-toolchain.toml)
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        id: cargo
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: set -o pipefail; cargo build --target aarch64-linux-android --release 2>&1 | tee release-v32815-cargo.log

      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          cargo_version=3.28.15
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.28.15
          workflow_run=${GITHUB_RUN_ID}
          baseline=v3.28.2_lineage(cumulative+3.27.23+sigsegv_guard+screen_mirror_a+crashlog_media_path)
          features=summary_training_session_gate,sigsegv_cooldown_600s,factor_index_badge_select_screen,boot_unconditional_hook_install,late_install_guard,il2cpp_class_gate,pointer_sanity_guard,reentry_guard,url_decode_utf8_fix,sigsegv_guard
          toolchain=rust-1.97.1-pinned
          runtime_validation=pending_device_execution
          EOF
          cat BUILD-MANIFEST.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          gh release create "v3.28.15" "$ASSET" SHA256SUMS BUILD-MANIFEST.txt hachimi_ura_plugin/release-v32815-cargo.log \
            --title "v3.28.15 修主页面闪退（summary 育成会话门禁）" \
            --notes "真机日志实锤：uma_predict.log 里反复出现 CRASH at step 209/189 sig=11 RECOVERED——后台 summary 在【不在育成】时读到了已释放的 WorkSingleModeData/Character，靠 siglongjmp 兜底反复重启循环，最终把进程带走。本版在 get_Character 之前加两道廉价门禁：① 对象头 klass 必须是 WorkSingleModeData（否则对象已被释放/复用）② _totalTurnNum(+68) 必须 >0（没有进行中的育成）；任一不满足就直接返回 not_in_training，不读任何字段，因此主界面不会再触发该崩溃。另把 SIGSEGV 冷却 60s→600s，避免一分钟一次的自杀循环。保留 v3.28.14 的装机加固与 v3.28.13 的因子選択屏序号。SHA256 见 SHA256SUMS。"
