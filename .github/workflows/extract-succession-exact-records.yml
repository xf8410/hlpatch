name: Extract Exact Succession Class Records

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-k-monitored:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cumulative A-K twice
        id: apply
        continue-on-error: true
        run: |
          set -o pipefail
          exec > >(tee docs/UNIFIED_K_LATEST_DIAGNOSTICS.txt) 2>&1
          set -euxo pipefail
          python3 scripts/fix_unified_endpoint_k_complete_anchors.py
          python3 scripts/fix_unified_endpoint_k_rust_types.py
          for pass in 1 2; do
            python3 scripts/fix_unified_endpoint_f_patch_anchors.py
            python3 scripts/apply_unified_endpoint_a_patch.py
            python3 scripts/apply_unified_endpoint_a_compile_fix.py
            python3 scripts/apply_unified_endpoint_b_storage_patch.py
            python3 scripts/apply_unified_endpoint_b_storage_compile_fix.py
            python3 scripts/apply_unified_endpoint_c_inherit_pair_patch.py
            python3 scripts/apply_unified_endpoint_d_selected_parent_patch.py
            python3 scripts/apply_unified_endpoint_e_runtime_correction.py
            python3 scripts/apply_unified_endpoint_f_pre_release_fix.py
            python3 scripts/apply_unified_endpoint_g_release_gate_fix.py
            python3 scripts/apply_unified_endpoint_h_response_headers.py
            python3 scripts/apply_unified_endpoint_i_parent_multisource.py
            python3 scripts/apply_unified_endpoint_j_parent_runtime_semantics.py
            python3 scripts/apply_unified_endpoint_k_complete.py
            sha256sum hachimi_ura_plugin/src/lib.rs|cut -d' ' -f1 > source-$pass.sha
          done
          cmp source-1.sha source-2.sha
      - name: Setup Rust
        if: steps.apply.outcome == 'success'
        run: rustup target add aarch64-linux-android
      - name: Setup NDK
        if: steps.apply.outcome == 'success'
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true
      - name: Build Android arm64 release
        if: steps.apply.outcome == 'success'
        id: cargo
        continue-on-error: true
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          set -o pipefail
          cargo build --target aarch64-linux-android --release 2>&1 | tee -a ../docs/UNIFIED_K_LATEST_DIAGNOSTICS.txt
      - name: Generate manifest
        if: steps.apply.outcome == 'success' && steps.cargo.outcome == 'success'
        run: |
          set -euo pipefail
          A=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          H=$(sha256sum "$A"|cut -d' ' -f1); Z=$(stat -c%s "$A")
          printf '%s  %s\n' "$H" libhachimi_ura.so > SHA256SUMS
          printf 'source_commit=%s\nbinary_size=%s\nbinary_sha256=%s\nworkflow_run=%s\nbuild_kind=artifact_only\nendpoint_stage=K-monitored\n' "$(git rev-parse HEAD)" "$Z" "$H" "$GITHUB_RUN_ID" > BUILD-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: steps.apply.outcome == 'success' && steps.cargo.outcome == 'success'
        with:
          name: libhachimi_ura-unified-k-monitored-${{ github.sha }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
      - name: Commit diagnostics on failure
        if: always() && (steps.apply.outcome != 'success' || steps.cargo.outcome == 'failure')
        run: |
          set -euo pipefail
          printf '\napply=%s\ncargo=%s\nhead=%s\n' '${{ steps.apply.outcome }}' '${{ steps.cargo.outcome }}' "$(git rev-parse HEAD)" >> docs/UNIFIED_K_LATEST_DIAGNOSTICS.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/UNIFIED_K_LATEST_DIAGNOSTICS.txt
          git commit -m 'chore: save latest K build diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}
      - name: Require success
        if: steps.apply.outcome != 'success' || steps.cargo.outcome == 'failure'
        run: exit 1
