name: Build libmain.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Install GNU ARM64 Assembler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          NDK_BIN="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ln -sf /usr/bin/aarch64-linux-gnu-as "$NDK_BIN/as"

      - name: Build Dobby
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git dobby-src

          # Patch Dobby ARM64 asm: Mach-O syntax -> ELF syntax
          ASM_FILE="dobby-src/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
          python3 << 'PYEOF'
          import re
          asm_file = "dobby-src/source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm"
          with open(asm_file, 'r') as f:
              lines = f.readlines()
          new_lines = []
          for line in lines:
              # add 指令中的 @PAGEOFF -> #:lo12: 前缀
              if '@PAGEOFF' in line and line.strip().startswith('add'):
                  # 匹配: add REG, REG, symbol@PAGEOFF
                  m = re.match(r'(\s*add\s+\w+\s*,\s*\w+\s*,\s*)(\S+)@PAGEOFF(.*)', line)
                  if m:
                      indent_reg = m.group(1)
                      symbol = m.group(2)
                      rest = m.group(3)
                      line = f'{indent_reg}#:lo12:{symbol}{rest}\n'
                      print(f"  Patched: {line.strip()}")
              # adrp 指令中的 @PAGE -> 直接去掉
              elif '@PAGE' in line and line.strip().startswith('adrp'):
                  line = line.replace('@PAGE', '')
                  print(f"  Patched: {line.strip()}")
              new_lines.append(line)
          with open(asm_file, 'w') as f:
              f.writelines(new_lines)
          print('Patched closure_bridge_arm64.asm: Mach-O -> ELF syntax')
          PYEOF
          echo "=== Verifying patch ==="
          grep -n 'adrp\|add.*#:lo12' "$ASM_FILE" || true

          mkdir -p dobby-src/build && cd dobby-src/build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_ASM_FLAGS="-fno-integrated-as" \
            -DCMAKE_C_FLAGS="-fno-integrated-as" \
            -DCMAKE_CXX_FLAGS="-fno-integrated-as" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --target dobby_static -j$(nproc)

      - name: Download httplib
        run: |
          curl -L -o native/include/httplib.h https://raw.githubusercontent.com/yhirose/cpp-httplib/master/httplib.h

      - name: Build libmain.so
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p native/libs/include
          find dobby-src/build -name "*.a" -exec cp {} native/libs/libdobby.a \;
          cp -r dobby-src/include/. native/libs/include/
          mkdir -p native/build && cd native/build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmain-so
          path: native/build/libmain.so
