name: Build libmain.so
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r27d
    - name: Build Dobby
      env:
        NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/dobby_src
        mkdir -p /tmp/dobby_build && cd /tmp/dobby_build
        cmake /tmp/dobby_src -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release -DDOBBY_DEBUG=OFF -DDOBBY_BUILD_EXAMPLE=OFF -DDOBBY_BUILD_TEST=OFF -DPlugin.SymbolResolver=OFF -DPlugin.ImportTableReplace=OFF -DPlugin.Android.BionicLinkerUtil=ON
        cmake --build . --target dobby_static -j$(nproc)
        mkdir -p $GITHUB_WORKSPACE/native/libs/include
        cp /tmp/dobby_build/libdobby.a $GITHUB_WORKSPACE/native/libs/
        cp -r /tmp/dobby_src/include/. $GITHUB_WORKSPACE/native/libs/include/
    - name: Download httplib
      run: curl -L -o native/include/httplib.h https://raw.githubusercontent.com/yhirose/cpp-httplib/master/httplib.h
    - name: Build
      env:
        NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        mkdir -p native/build && cd native/build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release
        cmake --build . -j$(nproc)
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: libmain-so
        path: native/build/libmain.so
