name: Build libmain.so
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Clone Dobby
      run: git clone --depth 1 https://github.com/jmpews/Dobby.git third_party/Dobby
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      id: ndk
      with:
        ndk-version: r27d
    - name: Download httplib
      run: curl -L -o native/include/httplib.h https://raw.githubusercontent.com/yhirose/cpp-httplib/master/httplib.h
    - name: Build
      env:
        NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      run: |
        mkdir -p native/build && cd native/build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_shared -DCMAKE_BUILD_TYPE=Release
        cmake --build . -j$(nproc)
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: libmain-so
        path: native/build/libmain.so
