name: Build libmain.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Build Dobby
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          git clone https://github.com/jmpews/Dobby.git dobby-src
          cd dobby-src
          git checkout 85ed4c2df9dd
          cd ..
          mkdir -p dobby-src/build && cd dobby-src/build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDOBBY_DEBUG=OFF
          cmake --build . -j$(nproc)
          # Verify output
          ls -la libdobby.so

      - name: Download httplib
        run: |
          curl -L -o native/include/httplib.h https://raw.githubusercontent.com/yhirose/cpp-httplib/master/httplib.h

      - name: Build libmain.so
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          mkdir -p native/libs/include
          cp -r dobby-src/include/. native/libs/include/
          cp dobby-src/build/libdobby.so native/libs/libdobby.so

          mkdir -p native/build && cd native/build
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uma-hook-artifacts
          path: |
            native/build/libmain.so
            native/libs/libdobby.so
