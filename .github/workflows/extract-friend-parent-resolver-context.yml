name: Extract Friend Parent Resolver Context

on:
  push:
    branches:
      - workbench/unified-observation-endpoint-implementation-20260806
    paths:
      - ".github/workflows/extract-friend-parent-resolver-context.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact records from offline method index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/il2cpp_dump/dump_all_methods_ALL.json')
          data=json.loads(p.read_text())
          classes=data.get('classes', data if isinstance(data,list) else [])
          terms=[
            'TryGetTrainedCharaData','SingleModeSuccessionDeckSetEntity',
            'SingleModeSuccessionDeckLastUsedEntity','ISinglemodeStartSuccessionInfoAccessor',
            'SuccessionDeckRepository','SuccessionDeckSet','SuccessionDeckLastUsed',
            'SuccessionCharaSelectorModel','SingleModeStartSuccessionDeck',
            'FindRentalSuccessionTrainedCharaByCondition','GetUserInfoForRentalSuccessionTrainedChara',
          ]
          selected=[]
          for c in classes:
              text=json.dumps(c,ensure_ascii=False)
              if any(t in text for t in terms): selected.append(c)
          out=['# Complete friend parent resolver context','',f'record_count={len(selected)}','']
          for c in selected:
              out += [f"## {c.get('ns','')}.{c.get('class',c.get('name',''))}",'','```json',json.dumps(c,ensure_ascii=False,indent=2),'```','']
          Path('docs/FRIEND_PARENT_RESOLVER_CONTEXT.md').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit extraction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FRIEND_PARENT_RESOLVER_CONTEXT.md
          git commit -m "docs: capture complete friend parent resolver context" || exit 0
          git push origin HEAD:workbench/unified-observation-endpoint-implementation-20260806
