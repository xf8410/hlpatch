name: Extract Exact Succession Type Metadata

on:
  push:
    branches:
      - workbench/unified-observation-endpoint-implementation-20260806
    paths:
      - ".github/workflows/extract-succession-types.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract bounded exact-name windows
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          terms = [
              'SuccessionCharaInfo',
              'SuccessionTrainedCharaInfoFirst',
              'SuccessionTrainedCharaInfoSecond',
              'TrainedCharaId',
              'WinSaddleArray',
              'SuccessionFactor',
          ]
          paths = sorted(Path('data/il2cpp_dump').glob('dump_all_methods_*.json')) + [
              Path('reverse/il2cpp_key_classes_methods.txt'),
              Path('reverse/all_classes_dump.md'),
              Path('hachimi_ura_plugin/src/lib.rs'),
          ]
          output = ['# Bounded exact succession metadata', '']
          total_windows = 0
          max_windows = 160
          for path in paths:
              if not path.exists() or total_windows >= max_windows: break
              text = path.read_text(errors='replace')
              positions = []
              for term in terms:
                  start = 0
                  while total_windows + len(positions) < max_windows:
                      index = text.find(term, start)
                      if index < 0: break
                      positions.append((index, term))
                      start = index + len(term)
              if not positions: continue
              positions.sort()
              output += [f'## {path}', '']
              previous_end = -1
              for index, term in positions:
                  start = max(0, index - 700)
                  end = min(len(text), index + len(term) + 1700)
                  if start <= previous_end: continue
                  previous_end = end
                  total_windows += 1
                  output += [f'### hit {total_windows}: {term} at byte {index}', '', '```text', text[start:end], '```', '']
                  if total_windows >= max_windows: break
          output.insert(2, f'window_count={total_windows}')
          rendered = '\n'.join(output)
          assert len(rendered.encode()) < 800_000, len(rendered.encode())
          Path('docs/SUCCESSION_TYPE_METADATA_CONTEXT.md').write_text(rendered)
          PY

      - name: Commit metadata context
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SUCCESSION_TYPE_METADATA_CONTEXT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: bound exact succession type metadata'
          git push origin HEAD:${GITHUB_REF_NAME}
