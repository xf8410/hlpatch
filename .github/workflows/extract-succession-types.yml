name: Extract Exact Succession Type Metadata

on:
  push:
    branches:
      - workbench/unified-observation-endpoint-implementation-20260806
    paths:
      - ".github/workflows/extract-succession-types.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract exact type records and bounded references
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          exact_names = {
              'SuccessionCharaInfo',
              'TrainedCharaData',
              'WorkSingleModeCharaData',
              'SingleModeSuccessionFactor',
              'SuccessionFactor',
          }
          terms = sorted(exact_names | {
              'SuccessionTrainedCharaInfoFirst',
              'SuccessionTrainedCharaInfoSecond',
              'TrainedCharaId',
              'WinSaddleArray',
              'SuccessionFactor',
          })
          output = ['# Exact succession type metadata', '']

          for path in sorted(Path('data/il2cpp_dump').glob('dump_all_methods_*.json')):
              text = path.read_text(errors='replace')
              if not any(term in text for term in exact_names):
                  continue
              output += [f'## {path}', '']
              try:
                  data = json.loads(text)
                  records = []
                  def walk(value):
                      if isinstance(value, dict):
                          name = str(value.get('class_name', value.get('class', value.get('name', ''))))
                          serialized = json.dumps(value, ensure_ascii=False)
                          if any(('"' + term + '"') in serialized or name == term for term in exact_names):
                              records.append(value)
                          for child in value.values(): walk(child)
                      elif isinstance(value, list):
                          for child in value: walk(child)
                  walk(data)
                  seen = set()
                  for record in records:
                      encoded = json.dumps(record, ensure_ascii=False, sort_keys=True)
                      if encoded in seen: continue
                      seen.add(encoded)
                      output += ['```json', json.dumps(record, ensure_ascii=False, indent=2), '```', '']
              except Exception as error:
                  output += [f'json_parse_error={error}', '']

          source_paths = [
              Path('hachimi_ura_plugin/src/lib.rs'),
              Path('reverse/il2cpp_key_classes_methods.txt'),
              Path('reverse/all_classes_dump.md'),
          ]
          for path in source_paths:
              if not path.exists(): continue
              lines = path.read_text(errors='replace').splitlines()
              hits = [i for i, line in enumerate(lines) if any(term in line for term in terms)]
              if not hits: continue
              output += [f'## bounded references: {path}', '']
              ranges = []
              for index in hits:
                  start, end = max(0, index - 12), min(len(lines), index + 13)
                  if ranges and start <= ranges[-1][1]: ranges[-1] = (ranges[-1][0], max(ranges[-1][1], end))
                  else: ranges.append((start, end))
              for start, end in ranges:
                  output += ['```text']
                  output += [f'{i + 1:08d}: {lines[i]}' for i in range(start, end)]
                  output += ['```', '']

          Path('docs/SUCCESSION_TYPE_METADATA_CONTEXT.md').write_text('\n'.join(output))
          PY

      - name: Commit metadata context
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SUCCESSION_TYPE_METADATA_CONTEXT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: capture exact succession type metadata'
          git push origin HEAD:${GITHUB_REF_NAME}
