name: Release v3.27.6 Unified A-H

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55b9f3496e8cfd7343ac1a04963445e800092442
          fetch-depth: 0

      - name: Validate immutable source and apply A-H twice
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "55b9f3496e8cfd7343ac1a04963445e800092442"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.6"
          python3 scripts/fix_unified_endpoint_f_patch_anchors.py
          for pass in 1 2; do
            python3 scripts/apply_unified_endpoint_a_patch.py
            python3 scripts/apply_unified_endpoint_a_compile_fix.py
            python3 scripts/apply_unified_endpoint_b_storage_patch.py
            python3 scripts/apply_unified_endpoint_b_storage_compile_fix.py
            python3 scripts/apply_unified_endpoint_c_inherit_pair_patch.py
            python3 scripts/apply_unified_endpoint_d_selected_parent_patch.py
            python3 scripts/apply_unified_endpoint_e_runtime_correction.py
            python3 scripts/apply_unified_endpoint_f_pre_release_fix.py
            python3 scripts/apply_unified_endpoint_g_release_gate_fix.py
            python3 scripts/apply_unified_endpoint_h_response_headers.py
            sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1 > source-$pass.sha
          done
          cmp source-1.sha source-2.sha
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hachimi_ura_plugin/src/lib.rs').read_text()
          required=[
            'method_index_watchdog_timeout', 'process_start_token TEXT NOT NULL',
            'InvokeCompletionEvent', 'observe_unity_response_completion',
            'GetResponseHeaders', 'take_unity_response_headers(&response_url)',
            'persist_protocol_capture("response", rid, &response_url, headers_json.as_bytes(), &bytes)',
            'storage_set_error("response_headers_not_correlated")',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          PY
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist|truncate|preview' \
            scripts/apply_unified_endpoint_g_release_gate_fix.py \
            scripts/apply_unified_endpoint_h_response_headers.py

      - name: Refuse overwrite and create immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.27.6 >/dev/null 2>&1; then
            echo 'release v3.27.6 already exists; refusing overwrite' >&2
            exit 1
          fi
          if git rev-parse -q --verify refs/tags/v3.27.6 >/dev/null; then
            test "$(git rev-list -n1 v3.27.6)" = "55b9f3496e8cfd7343ac1a04963445e800092442"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a v3.27.6 55b9f3496e8cfd7343ac1a04963445e800092442 -m 'Release v3.27.6'
            git push origin refs/tags/v3.27.6
          fi

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --target aarch64-linux-android --release

      - name: Publish immutable Release and verify asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=55b9f3496e8cfd7343ac1a04963445e800092442
          cargo_version=3.27.6
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.6
          workflow_run=${GITHUB_RUN_ID}
          endpoint_stage=H-response-headers
          cumulative_patches=A,B,C,D,E,F,G,H
          response_headers_capture=unity_async_completion_get_response_headers
          response_headers_missing_behavior=explicit_storage_error_response_headers_not_correlated
          EOF
          NOTES=$(cat <<EOF
          Unified observation endpoint release through H stage.

          Source commit: 55b9f3496e8cfd7343ac1a04963445e800092442
          Cargo version: 3.27.6
          Binary size: $SIZE bytes
          SHA-256: $SHA256
          Workflow run: $GITHUB_RUN_ID
          EOF
          )
          gh release create v3.27.6 --verify-tag --title v3.27.6 --notes "$NOTES" \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt
          API_DIGEST=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.6 \
            --jq '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$API_DIGEST" = "sha256:$SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-v3.27.6
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
