name: Release v3.27.18 Remove Sniff Body Storage

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and validate release source
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('hachimi_ura_plugin/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text = text.replace('version = "3.27.11"', 'version = "3.27.18"', 1)
          cargo.write_text(text, encoding='utf-8')
          lock = Path('hachimi_ura_plugin/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          text = text.replace('name = "hachimi_ura"\nversion = "3.27.11"', 'name = "hachimi_ura"\nversion = "3.27.18"', 1)
          lock.write_text(text, encoding='utf-8')
          PY
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.18"
          grep -Fq 'version = "3.27.18"' hachimi_ura_plugin/Cargo.lock
          grep -Fq 'verified_ramen_upstream_semantics' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Ramen turn mapping follows upstream umaai-rs semantics' hachimi_ura_plugin/src/lib.rs

      - name: Add non-mutating HookRegistry address validation
        run: |
          set -euo pipefail
          apply_validation() {
            python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('hachimi_ura_plugin/src/lib.rs')
          text = source.read_text(encoding='utf-8')
          marker = '// ===== Next-generation HookRegistry address validation ====='
          if marker in text:
              print('hook_registry_address_validation=already_applied')
              raise SystemExit(0)

          boot = re.search(r'((?:static|const)\s+BOOT_SAFE_EXACT\b[^=]*=\s*&\[)', text, re.M)
          if boot is None:
              raise RuntimeError('BOOT_SAFE_EXACT declaration missing')
          end = text.find('];', boot.end())
          if end < 0:
              raise RuntimeError('BOOT_SAFE_EXACT terminator missing')
          if '"/hooks/validation"' not in text[boot.start():end]:
              text = text[:boot.end()] + '\n    "/hooks/validation",' + text[boot.end():]

          anchor = 'fn foundation_parameter_types_json(values: &[&str]) -> String {\n'
          if text.count(anchor) != 1:
              raise RuntimeError(f'validation code anchor count={text.count(anchor)}')
          rust = r'''// ===== Next-generation HookRegistry address validation =====
          struct FoundationAddressValidation {
              map_start: usize,
              map_end: usize,
              permissions: String,
              module_path: String,
              current_prologue: Vec<u8>,
          }

          fn foundation_validate_address(address: usize) -> Result<FoundationAddressValidation, String> {
              if address == 0 {
                  return Err("target_address_not_observed".to_string());
              }
              if address % 4 != 0 {
                  return Err("target_address_not_arm64_aligned".to_string());
              }
              let maps = std::fs::read_to_string("/proc/self/maps")
                  .map_err(|e| format!("maps_read_error: {}", e))?;
              for line in maps.lines() {
                  let parts: Vec<&str> = line.splitn(6, ' ').collect();
                  if parts.len() < 5 { continue; }
                  let range: Vec<&str> = parts[0].split('-').collect();
                  if range.len() != 2 { continue; }
                  let start = usize::from_str_radix(range[0], 16).unwrap_or(0);
                  let end = usize::from_str_radix(range[1], 16).unwrap_or(0);
                  if address >= start && address < end {
                      let perms = parts[1].to_string();
                      let path = if parts.len() >= 6 { parts[5].to_string() } else { String::new() };
                      let prologue = if perms.contains('r') {
                          let mut buf = [0u8; 16];
                          let file = std::fs::File::open("/proc/self/mem")
                              .map_err(|e| format!("mem_open_error: {}", e))?;
                          use std::os::unix::fs::FileExt;
                          let _ = file.read_at(&mut buf, address as u64);
                          buf.to_vec()
                      } else { Vec::new() };
                      return Ok(FoundationAddressValidation {
                          map_start: start,
                          map_end: end,
                          permissions: perms,
                          module_path: path,
                          current_prologue: prologue,
                      });
                  }
              }
              Err("target_address_not_in_any_mapped_region".to_string())
          }
          '''
          text = text.replace(anchor, rust + '\n' + anchor)
          source.write_text(text, encoding='utf-8')
          PY
          }
          apply_validation
          FIRST_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          apply_validation
          SECOND_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST_SHA" = "$SECOND_SHA"

      - name: Remove sniff packet body storage
        run: |
          set -euo pipefail
          cd hachimi_ura_plugin/src
          # Disable raw request body storage — keep metadata only
          sed -i 's/SNIFF_REQUESTS\.push((rid, url_str, headers_json, body));/\/\/ SNIFF_REQUESTS disabled — body storage removed v3.27.18/' lib.rs
          # Disable raw response body storage — keep metadata only
          sed -i 's/SNIFF_RESPONSES\.push((rid, bytes));/\/\/ SNIFF_RESPONSES disabled — body storage removed v3.27.18/' lib.rs
          # Verify patches applied
          grep -c 'body storage removed v3.27.18' lib.rs | grep -q '^2$'
          # Verify the push calls are gone
          ! grep -q 'SNIFF_REQUESTS\.push' lib.rs
          ! grep -q 'SNIFF_RESPONSES\.push' lib.rs
          echo "Sniff body storage removed successfully"

      - name: Audit changed implementation path
        run: |
          set -euo pipefail
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist' \
            scripts/run_generated_succession_l_cumulative.py

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          HLPATCH_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          cargo build --target aarch64-linux-android --release 2>&1 | tee release-v32718-cargo.log
          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee -a release-v32718-cargo.log

      - name: Prepare release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          cargo_version=3.27.18
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.18
          workflow_run=${GITHUB_RUN_ID}
          feature=remove_sniff_body_storage
          changes=disabled_SNIFF_REQUESTS_and_SNIFF_RESPONSES_push_calls
          endpoints=/summary
          runtime_validation=pending_device_execution
          EOF

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          if gh release view v3.27.18 > /dev/null 2>&1; then
            echo 'v3.27.18 already exists; refusing to overwrite' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v3.27.18 "$GITHUB_SHA" -m "Release v3.27.18"
          git push origin refs/tags/v3.27.18
          gh release create v3.27.18 --verify-tag --title v3.27.18 \
            --notes "Remove sniff packet body storage to prevent memory accumulation.

          - SNIFF_REQUESTS.push disabled: no longer stores raw request bodies (URL, headers, size still captured in metadata)
          - SNIFF_RESPONSES.push disabled: no longer stores raw response bodies (URL, size still captured in metadata)
          - SNIFF_METADATA still records URL, timestamp, and packet size for debugging
          - /api/sniff endpoint returns empty body arrays but metadata still available via /api/sniff/metadata
          - All AI evaluation and ramen cup features from v3.27.17 remain unchanged" \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt

      - name: Verify release identity and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          RELEASE_JSON=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.18)
          test "$(git rev-list -n1 v3.27.18)" = "$GITHUB_SHA"
          test "$(printf '%s' "$RELEASE_JSON" | jq '[.assets[] | select(.name == "libhachimi_ura.so")] | length')" = "1"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .size')" = "$SIZE"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .digest')" = "sha256:$SHA256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libhachimi_ura-v3.27.18-run-${{ github.run_id }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/release-v32718-cargo.log
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: warn
