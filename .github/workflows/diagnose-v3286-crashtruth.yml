name: "Diagnose v3.28.6 crash-forensics patch (dry run, read-only)"

# 干跑：v3.28.5 完整链（含 crash-truth）之后叠加 v3.28.6 取证补丁，
# 校验：幂等（跑两遍 sha 相等）、关键新标记、pc/lr/线程表、7 个新检查点、
# 旧 _ctx 签名消失、缓冲 320。不编译、不发布。
on:
  push:
    branches:
      - workbench/v3285-features
    paths:
      - .github/workflows/diagnose-v3286-crashtruth.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  BASELINE_SHA: 721c086220ea081523229d88623de5abddd97eaa

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: "Fetch main helper scripts"
        run: |
          set -euo pipefail
          git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main

      - name: "Pin baseline + apply full v3.28.5 chain + v3.28.6 forensics"
        run: |
          set -euo pipefail
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git checkout "$BASELINE_SHA" -- scripts hachimi_ura_plugin
          git checkout refs/remotes/origin/main -- scripts/apply_sigsegv_guard_v32723.py scripts/strip_ai_output_v3283.py scripts/apply_dynamic_version.py scripts/bump_plugin_version.py
          for f in apply_summary_crash_truth_v3285.py apply_crash_forensics_v3286.py apply_crash_log_path_fix.py apply_meta_query_route_v3284.py; do
            test -f "scripts/$f"
          done
          python3 scripts/run_generated_succession_l_cumulative.py > /dev/null
          python3 scripts/bump_plugin_version.py 3.27.23 > /dev/null
          python3 scripts/apply_sigsegv_guard_v32723.py > /dev/null
          python3 scripts/bump_plugin_version.py 3.28.0 > /dev/null
          python3 scripts/apply_crash_log_path_fix.py > /dev/null
          python3 scripts/strip_ai_output_v3283.py > /dev/null
          python3 scripts/apply_dynamic_version.py > /dev/null
          python3 scripts/apply_meta_query_route_v3284.py > /dev/null
          python3 scripts/apply_summary_crash_truth_v3285.py

      - name: "Stage: v3.28.6 forensics patch (idempotent x2, sha equal)"
        run: |
          set -euo pipefail
          F=hachimi_ura_plugin/src/lib.rs
          python3 scripts/apply_crash_forensics_v3286.py
          S1=$(sha256sum "$F" | cut -d' ' -f1)
          python3 scripts/apply_crash_forensics_v3286.py | grep -q already_applied
          S2=$(sha256sum "$F" | cut -d' ' -f1)
          test "$S1" = "$S2"
          echo "idempotent_sha=$S1"

      - name: "Qualification greps"
        run: |
          set -euo pipefail
          F=hachimi_ura_plugin/src/lib.rs
          for s in \
            'fn hl_put_mod(' \
            'fn hl_put_thr(' \
            'fn hl_modules_init()' \
            'hl_thread_register("init")' \
            'hl_thread_register("push")' \
            'hl_thread_register("http")' \
            'b" pc="' \
            'b" lr="' \
            'b" thr="' \
            'HL_THR_TID' \
            'S:enter' \
            'S:exit' \
            'H:ret' \
            'H:saved' \
            'P:read_done' \
            'P:push_start' \
            'P:push_done' \
            'let mut msg = [0u8; 320];' \
            'S:json_built' \
            'S:cache_done' \
            'let verdict: &[u8]'
          do grep -aFq "$s" "$F" || { echo "MISSING: $s"; exit 1; }; done
          if grep -aFq '_ctx: *mut libc::c_void' "$F"; then
            echo "REGRESSION: old _ctx signature still present"; exit 1
          fi
          test "$(grep -a -c 'S:exit' "$F")" -ge 1
          test "$(grep -a -c 'H:saved' "$F")" -ge 1
          test "$(grep -a -c 'P:push_done' "$F")" -ge 1
          echo "greps_ok"

      - name: "Region dumps (manual review)"
        run: |
          set -uo pipefail
          F=hachimi_ura_plugin/src/lib.rs
          echo "file_bytes=$(wc -c < "$F")"
          echo '=== [F1] module table + thread registry ==='
          grep -an -B4 -A28 'fn hl_modules_init' "$F" | head -60 || true
          echo '=== [F2] pc/lr extraction ==='
          grep -an -B6 -A24 'fault_pc, fault_lr' "$F" | head -70 || true
          echo '=== [F3] pc/lr/thr pieces ==='
          grep -an -B4 -A30 'b" pc="' "$F" | head -70 || true
          echo '=== [F4] new checkpoints ==='
          grep -an 'S:enter\|S:exit\|H:ret\|H:saved\|P:read_done\|P:push_start\|P:push_done' "$F" | head -30 || true
          echo '=== [F5] counts ==='
          echo "pc_pieces=$(grep -a -c 'b\" pc=\"' "$F" || true)"
          echo "thread_labels=$(grep -a -c 'hl_thread_register' "$F" || true)"
