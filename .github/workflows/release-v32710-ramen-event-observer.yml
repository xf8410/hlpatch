name: Release v3.27.11 Protocol Archive Reliability
on:
  push:
    branches:
      - workbench/ramen-hachimi-text-observer-20260807
    paths:
      - .github/workflows/release-v32710-ramen-event-observer.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07adec9d24d721b1341191f8ffa8e15bc88ab931
          fetch-depth: 0
      - name: Validate immutable source and cumulative implementation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "07adec9d24d721b1341191f8ffa8e15bc88ab931"
          python3 scripts/run_generated_succession_l_cumulative.py
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.11"
          grep -Fq 'Protocol archive reliability P-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Protocol multi-section event timeline O-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Hachimi TextCommon final display observer N-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Ramen/Hachimi global durable observation M-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'protocol_exchange_export_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'protocol_exchanges_export_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'protocol_archive_audit_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'std::slice::from_raw_parts(data_ptr, len).to_vec()' hachimi_ura_plugin/src/lib.rs
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist|truncate|preview' scripts/apply_ramen_global_durable_observation.py scripts/apply_hachimi_textcommon_observer.py scripts/apply_protocol_multisection_event_timeline.py scripts/apply_protocol_archive_reliability_p.py
      - name: Inspect existing immutable release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v3.27.11 >/dev/null; then
            test "$(git rev-list -n 1 v3.27.11)" = "07adec9d24d721b1341191f8ffa8e15bc88ab931"
          fi
      - name: Setup Rust
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true
      - name: Build Android arm64 release
        id: cargo
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: set -o pipefail; cargo build --target aarch64-linux-android --release 2>&1 | tee release-v32711-cargo.log
      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=07adec9d24d721b1341191f8ffa8e15bc88ab931
          cargo_version=3.27.11
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.11
          workflow_run=${GITHUB_RUN_ID}
          features=durable_timeline,textcommon_final_display,protocol_multisection,pending_choice,full_payload,boot_safe_archive,precise_exchange_export,archive_audit
          ci_qualification_run=31245472605
          runtime_validation=pending_device_execution
          EOF
      - name: Create or verify immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v3.27.11 >/dev/null; then
            test "$(git rev-list -n 1 v3.27.11)" = "07adec9d24d721b1341191f8ffa8e15bc88ab931"
          else
            git tag -a v3.27.11 07adec9d24d721b1341191f8ffa8e15bc88ab931 -m 'Release v3.27.11'
            git push origin refs/tags/v3.27.11
          fi
      - name: Create Release when absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          if ! gh release view v3.27.11 >/dev/null 2>&1; then
            gh release create v3.27.11 --verify-tag --title v3.27.11 --notes "Adds boot-safe persistent session access, precise request/response exchange export, protocol archive auditing, full payload capture, multi-section MessagePack detection, pending choice correlation, and final TextCommon observation. CI qualification: run 31245472605. Runtime validation remains pending." "$ASSET" SHA256SUMS BUILD-MANIFEST.txt
          fi
      - name: Verify published Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          RELEASE_JSON=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.11)
          ASSET_COUNT=$(printf '%s' "$RELEASE_JSON" | jq '[.assets[] | select(.name == "libhachimi_ura.so")] | length')
          test "$ASSET_COUNT" = 1
          API_SIZE=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .size')
          API_DIGEST=$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$API_SIZE" = "$SIZE"
          test "$API_DIGEST" = "sha256:$SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libhachimi_ura-v3.27.11-run-${{ github.run_id }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/release-v32711-cargo.log
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: warn
