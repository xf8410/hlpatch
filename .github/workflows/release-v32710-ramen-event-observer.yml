name: Release v3.27.10 Ramen Event Observer
on:
  push:
    branches:
      - workbench/ramen-hachimi-text-observer-20260807
    paths:
      - .github/workflows/release-v32710-ramen-event-observer.yml
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3936f92313d5c5b98012d98a8730ad075a9c5d73
          fetch-depth: 0
      - name: Validate immutable source and cumulative implementation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3936f92313d5c5b98012d98a8730ad075a9c5d73"
          python3 scripts/run_generated_succession_l_cumulative.py
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.10"
          grep -Fq 'Protocol multi-section event timeline O-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Hachimi TextCommon final display observer N-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Ramen/Hachimi global durable observation M-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'all_sections_are_nonexclusive' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'post_choice_pre_ui' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'std::slice::from_raw_parts(data_ptr, len).to_vec()' hachimi_ura_plugin/src/lib.rs
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist|truncate|preview' scripts/apply_ramen_global_durable_observation.py scripts/apply_hachimi_textcommon_observer.py scripts/apply_protocol_multisection_event_timeline.py
      - name: Refuse overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view v3.27.10 >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin refs/tags/v3.27.10 >/dev/null 2>&1
      - name: Setup Rust
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true
      - name: Build Android arm64 release
        id: cargo
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: set -o pipefail; cargo build --locked --target aarch64-linux-android --release 2>&1 | tee release-v32710-cargo.log
      - name: Publish immutable Release and verify digest
        if: steps.cargo.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=3936f92313d5c5b98012d98a8730ad075a9c5d73
          cargo_version=3.27.10
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.10
          workflow_run=${GITHUB_RUN_ID}
          features=durable_timeline,textcommon_final_display,protocol_multisection,pending_choice,full_payload
          ci_qualification_run=31191206471
          runtime_validation=pending_device_execution
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v3.27.10 3936f92313d5c5b98012d98a8730ad075a9c5d73 -m 'Release v3.27.10'
          git push origin refs/tags/v3.27.10
          gh release create v3.27.10 --verify-tag --title v3.27.10 --notes "Adds durable global observation, final TextCommon display capture, complete protocol payload persistence, recursive MessagePack multi-section detection, and pending choice/result correlation. CI qualification: run 31191206471. Runtime validation remains pending." "$ASSET" SHA256SUMS BUILD-MANIFEST.txt
          API_DIGEST=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.10 --jq '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$API_DIGEST" = "sha256:$SHA256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libhachimi_ura-v3.27.10-run-${{ github.run_id }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/release-v32710-cargo.log
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: warn
