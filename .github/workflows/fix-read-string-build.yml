name: Fix and promote read_string build
on:
  workflow_dispatch:
  push:
    branches: [workbench/fix-read-string-build]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/fix-read-string-build
          fetch-depth: 0
      - name: Repair source
        run: python3 .github/scripts/fix_read_string_build.py
      - name: Commit branch fix
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add hachimi_ura_plugin/src/lib.rs
          git commit -m "fix read_string route return scope"
          git push origin HEAD:workbench/fix-read-string-build
      - name: Promote to main
        run: |
          FIX=$(git rev-parse HEAD)
          git checkout main
          git pull --ff-only origin main
          git cherry-pick "$FIX"
          git push origin main
