name: Build HTTP Proxy Endpoint

on:
  push:
    branches:
      - workbench/http-proxy-endpoint-20260907
    paths:
      - "hachimi_ura_plugin/**"
      - "scripts/**"
      - ".github/workflows/build-http-proxy-endpoint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate cumulative source and http proxy endpoint
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py
          python3 tooling/apply_turn_event_json_export.py
          python3 scripts/apply_signup_plaintext_observer.py
          python3 scripts/apply_protocol_send_discovery.py
          python3 scripts/apply_keychain_source_observer.py
          python3 scripts/apply_http_proxy_endpoint.py
          cargo generate-lockfile --manifest-path hachimi_ura_plugin/Cargo.toml
          FIRST=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          python3 scripts/apply_http_proxy_endpoint.py
          SECOND=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST" = "$SECOND"
          grep -Fq 'mod http_proxy;' hachimi_ura_plugin/src/lib.rs
          grep -Fq '"/proxy"' hachimi_ura_plugin/src/lib.rs
          grep -Fq '"/proxy/status"' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'http_proxy::endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'http_proxy::status_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'validate_url' hachimi_ura_plugin/src/http_proxy.rs
          grep -Fq 'private_address_blocked' hachimi_ura_plugin/src/http_proxy.rs
          grep -Fq 'body_too_large' hachimi_ura_plugin/src/http_proxy.rs

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 SO
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          HLPATCH_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee http-proxy-endpoint-cargo.log

      - name: Manifest
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          binary_size=$SIZE
          binary_sha256=$SHA256
          workflow_run=${GITHUB_RUN_ID}
          feature=http_proxy_endpoint
          endpoints=/proxy?url=,/proxy/status
          safety=https_only_port_443_no_userinfo_private_net_blocked_16mib_cap_20s_timeout_max2_concurrent_boot_safe
          runtime_validation=pending_device_execution
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-http-proxy-endpoint-${{ github.sha }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/http-proxy-endpoint-cargo.log
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
