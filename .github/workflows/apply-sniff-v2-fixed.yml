name: Apply sniff v2 fixed (retired)

# Retired one-shot migration workflow.
#
# This workflow formerly patched workbench/sniff-v2 by matching old source
# literals. The migration has already been applied, so rerunning it against
# newer plugin sources produces false failures and can push unintended changes
# to another branch. Keep a harmless manual entry for historical visibility,
# but never run it automatically and never modify repository contents.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy workflow retired
        run: |
          echo "apply-sniff-v2-fixed was a one-shot migration and is now retired."
          echo "No source files were changed and no branch was pushed."
