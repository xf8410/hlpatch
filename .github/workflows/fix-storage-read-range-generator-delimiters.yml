name: Fix storage read_range generator delimiters

on:
  push:
    branches:
      - workbench/next-generation-so-foundation-20260808
    paths:
      - ".github/workflows/fix-storage-read-range-generator-delimiters.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch exact delimiter lines
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/implement-storage-read-range.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          start = "          patch.write_text(r'''from pathlib import Path\n"
          end = "          ''', encoding=\"utf-8\")\n"
          start_indexes = [i for i, line in enumerate(lines) if line == start]
          end_indexes = [i for i, line in enumerate(lines) if line == end]
          if len(start_indexes) != 1 or len(end_indexes) != 1:
              raise RuntimeError(f'delimiter anchors start={start_indexes} end={end_indexes}')
          lines[start_indexes[0]] = '          patch.write_text(r"""from pathlib import Path\n'
          lines[end_indexes[0]] = '          """, encoding="utf-8")\n'
          path.write_text(''.join(lines), encoding='utf-8')
          PY
          git diff -- .github/workflows/implement-storage-read-range.yml
          ! git diff --quiet -- .github/workflows/implement-storage-read-range.yml

      - name: Commit exact delimiter fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/implement-storage-read-range.yml
          git diff --cached --quiet && exit 1
          git commit -m "fix: separate outer A1 generator delimiters"
          git push origin HEAD:${GITHUB_REF_NAME}
