name: Diagnose factor badge anchors (3.28.2-equivalent chain)

# Read-only diagnostic: generates the exact 3.28.2-lineage source
# (cumulative -> 3.27.23 -> sigsegv guard -> screen mirror A) and dumps
# every anchor the factor-index-badge patch will need. Never builds,
# never releases, never touches main.

on:
  workflow_dispatch:
  push:
    branches:
      - workbench/factor-index-badge
    paths:
      - .github/workflows/diagnose-factor-badge-anchors.yml
      - hachimi_ura_plugin/src/factor_index_badge.rs

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Generate 3.28.2-equivalent source chain
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py
          python3 scripts/bump_plugin_version.py 3.27.23
          python3 scripts/apply_sigsegv_guard_v32723.py
          python3 scripts/apply_screen_mirror_frame_a.py
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.28.0"
          grep -Fq 'install_screen_mirror_hook' hachimi_ura_plugin/src/lib.rs

      - name: Anchor census
        run: |
          set -euo pipefail
          SRC=hachimi_ura_plugin/src/lib.rs
          mkdir -p docs
          {
            echo "# Factor badge anchor dump"
            echo
            echo "- run: ${GITHUB_RUN_ID} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo "- source_commit: ${GITHUB_SHA}"
            echo
            echo "## chain state"
            echo
            echo "- cargo_version=$(sed -n 's/^version = \"\([^\"]*\)\"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)"
            echo "- lib_rs_sha256=$(sha256sum "$SRC" | cut -d' ' -f1)"
            echo "- lib_rs_bytes=$(stat -c%s "$SRC")"
            echo "- pokeuma_paths=$(grep -ac 'jp.pokemon.pokeuma' "$SRC" || true)"
            echo "- media_paths=$(grep -ac 'Android/media' "$SRC" || true)"
            echo
            echo "## anchor counts (expect column is what the patch script will assert)"
            echo
            echo '| anchor | count |'
            echo '|---|---|'
            for s in \
              'const PLUGIN_VERSION: &str = env!("CARGO_PKG_VERSION");' \
              'mod training_anim_skip;' \
              'mod signup_plaintext;' \
              'install_event_choice_hook();' \
              'install_api_sniff_hooks();' \
              'install_training_hook();' \
              'install_screen_mirror_hook();' \
              '} else if path == "/api/sniff/clear" {' \
              '} else if path == "/api/training/anim_skip" {' \
              'fn install_hook_safe(' \
              'unsafe fn interceptor_hook(' \
              'unsafe fn read_il2cpp_string(' \
              'fn hl_ptr_mapped(' \
              'unsafe fn read_ptr_at(' \
              'unsafe fn read_int_at(' \
              'unsafe fn resolve_il2cpp_symbol(' \
              'fn set_hook_status('
            do printf '| `%s` | %s |\n' "$s" "$(grep -aFc "$s" "$SRC" || true)"; done
            echo
            echo '## BOOT_SAFE_EXACT block (first definition)'
            echo
            echo '```rust'
            awk '/BOOT_SAFE_EXACT/{flag=1} flag{print} flag&&/\];/{exit}' "$SRC" | head -80
            echo '```'
            echo
            echo '## install call sites context (install_event_choice_hook)'
            echo
            echo '```text'
            grep -aFn -B2 -A2 'install_event_choice_hook();' "$SRC" | head -60
            echo '```'
          } | tee docs/FACTOR_BADGE_ANCHOR_DUMP.md

      - name: Commit anchor dump
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FACTOR_BADGE_ANCHOR_DUMP.md
          git commit -m 'chore: factor badge anchor dump (3.28.2-equivalent chain)' || echo 'nothing to commit'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload anchor dump artifact
        uses: actions/upload-artifact@v4
        with:
          name: factor-badge-anchor-dump-${{ github.sha }}
          path: docs/FACTOR_BADGE_ANCHOR_DUMP.md
          if-no-files-found: error
