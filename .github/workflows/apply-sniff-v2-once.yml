name: Diagnose sniff v2 patch
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/workflows/apply-sniff-v2-once.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/sniff-v2
      - name: Capture exact source match diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('hachimi_ura_plugin/src/lib.rs')
          s=p.read_text()
          tests={
            'globals_literal': '''// SniffEntry: (id, url, headers_json, body)\nstatic mut SNIFF_REQUESTS: Vec<(u64, String, String, Vec<u8>)> = Vec::new();\nstatic mut SNIFF_RESPONSES: Vec<(u64, Vec<u8>)> = Vec::new();\nstatic SNIFF_MAX: usize = 20;\nstatic SNIFF_REQ_ID: AtomicU64 = AtomicU64::new(0);''',
            'pending_literal': '''static mut PENDING_COMPRESSED: usize = 0;\n// ★ Mutex to prevent concurrent read_summary_inner''',
            'toggle_marker': '''    } else if path == "/api/sniff/toggle" {''',
            'clear_pair_regex': r'SNIFF_REQUESTS\.clear\(\);\n\s*SNIFF_RESPONSES\.clear\(\);',
            'response_regex': r'let rid = PENDING_REQ_ID;\n\s*SNIFF_RESPONSES\.push\(\(rid, bytes\)\);\n\s*if SNIFF_RESPONSES\.len\(\) > SNIFF_MAX \{\n\s*SNIFF_RESPONSES\.remove\(0\);\n\s*\}',
            'request_literal': '''            // Try to match parked request body\n            if let Some(body) = PENDING_REQ_BODY.take() {\n                let headers_json = format_headers_json(&req_headers);\n                let url_str = game_url.clone().unwrap_or_default();\n                let _lock = SNIFF_MUTEX.lock();\n                SNIFF_REQUESTS.push((rid, url_str, headers_json, body));\n                if SNIFF_REQUESTS.len() > SNIFF_MAX {\n                    SNIFF_REQUESTS.remove(0);\n                }\n            }\n            PENDING_URL = game_url.clone().unwrap_or_default();''',
          }
          out=['# Sniff v2 patch diagnostics','',f'source_bytes={len(s)}','']
          for name,pat in tests.items():
              count=len(re.findall(pat,s)) if name.endswith('_regex') else s.count(pat)
              out.append(f'- {name}: `{count}`')
          terms=['SNIFF_MAX','SNIFF_REQUESTS.clear','let rid = PENDING_REQ_ID','Try to match parked request body','/api/sniff/toggle']
          lines=s.splitlines()
          out += ['','## Exact hit lines','']
          for term in terms:
              hits=[i for i,x in enumerate(lines) if term in x]
              out.append(f'### `{term}` hits={len(hits)}')
              for i in hits:
                  a=max(0,i-3); b=min(len(lines),i+10)
                  out += ['```rust']+[f'{j+1}: {lines[j]}' for j in range(a,b)]+['```']
          Path('docs/sniff-v2-diagnostics.md').write_text('\n'.join(out))
          PY
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/sniff-v2-diagnostics.md
          git commit -m 'docs: capture sniff v2 patch diagnostics' || true
          git push origin HEAD:workbench/sniff-v2
