name: Apply sniff v2 once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/sniff-v2
      - name: Apply six sniff upgrades
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re
          p=Path('hachimi_ura_plugin/src/lib.rs')
          s=p.read_text()
          def sub(pattern,repl,count=1,flags=0):
              global s
              s2,n=re.subn(pattern,repl,s,count=count,flags=flags)
              if n != count: raise SystemExit(f'pattern matched {n}, expected {count}: {pattern[:120]}')
              s=s2

          sub(r'''// SniffEntry: \(id, url, headers_json, body\)\nstatic mut SNIFF_REQUESTS: Vec<\(u64, String, String, Vec<u8>\)> = Vec::new\(\);\nstatic mut SNIFF_RESPONSES: Vec<\(u64, Vec<u8>\)> = Vec::new\(\);\nstatic SNIFF_MAX: usize = 20;\nstatic SNIFF_REQ_ID: AtomicU64 = AtomicU64::new\(0\);''','''// Raw payloads and safe metadata use separate bounded rings.
// Raw tuples intentionally retain the legacy /api/sniff response shape.
static mut SNIFF_REQUESTS: Vec<(u64, String, String, Vec<u8>)> = Vec::new();
static mut SNIFF_RESPONSES: Vec<(u64, Vec<u8>)> = Vec::new();
const SNIFF_RAW_MAX: usize = 50;
const SNIFF_METADATA_MAX: usize = 1000;
static SNIFF_REQ_ID: AtomicU64 = AtomicU64::new(1);
static SNIFF_METADATA_ID: AtomicU64 = AtomicU64::new(1);
#[derive(Clone)]
struct SniffMetadata {
    id: u64,
    request_id: u64,
    timestamp_ms: u64,
    direction: &'static str,
    path: String,
    size: usize,
}
static mut SNIFF_METADATA: Vec<SniffMetadata> = Vec::new();
// Response order is tracked independently instead of always using the latest request id.
// It is bounded temporal FIFO correlation; unmatched responses are explicitly id 0.
static mut SNIFF_RESPONSE_QUEUE: Vec<(u64, String)> = Vec::new();''')

          sub(r'''static mut PENDING_COMPRESSED: usize = 0;\n// ★ Mutex to prevent concurrent read_summary_inner''','''static mut PENDING_COMPRESSED: usize = 0;

fn sniff_timestamp_ms() -> u64 {
    std::time::SystemTime::now()
        .duration_since(std::time::UNIX_EPOCH)
        .map(|d| d.as_millis().min(u128::from(u64::MAX)) as u64)
        .unwrap_or(0)
}
fn sniff_path(url: &str) -> String {
    let no_query = url.split('?').next().unwrap_or(url);
    if let Some(i) = no_query.find("://") {
        let rest = &no_query[i + 3..];
        return rest.find('/').map(|j| rest[j..].to_string()).unwrap_or_else(|| "/".to_string());
    }
    no_query.to_string()
}
unsafe fn push_sniff_metadata(request_id: u64, direction: &'static str, url: &str, size: usize) {
    let id = SNIFF_METADATA_ID.fetch_add(1, Ordering::Relaxed);
    SNIFF_METADATA.push(SniffMetadata {
        id,
        request_id,
        timestamp_ms: sniff_timestamp_ms(),
        direction,
        path: sniff_path(url),
        size,
    });
    if SNIFF_METADATA.len() > SNIFF_METADATA_MAX { SNIFF_METADATA.remove(0); }
}
// ★ Mutex to prevent concurrent read_summary_inner''')

          # Boot-safe routing and download allowlist.
          s=s.replace('"/api/sniff", "/api/sniff/diag", "/api/sniff/toggle", "/api/sniff/clear",',
                      '"/api/sniff", "/api/sniff/metadata", "/api/sniff/status", "/api/sniff/diag", "/api/sniff/toggle", "/api/sniff/clear",')
          s=s.replace('"/api/sniff", "/api/sniff/diag", "/api/event/choices"',
                      '"/api/sniff", "/api/sniff/metadata", "/api/sniff/diag", "/api/event/choices"')
          s=s.replace('"/api/sniff","/api/sniff/toggle","/api/sniff/clear","/api/sniff/diag"',
                      '"/api/sniff","/api/sniff/metadata","/api/sniff/status","/api/sniff/toggle","/api/sniff/clear","/api/sniff/diag"')

          marker='''    } else if path == "/api/sniff/toggle" {'''
          if s.count(marker)!=1: raise SystemExit('toggle marker mismatch')
          routes='''    } else if path == "/api/sniff/status" {
        let _lock = SNIFF_MUTEX.lock();
        unsafe {
            let last_id = SNIFF_METADATA.last().map(|m| m.id).unwrap_or(0);
            let requests = SNIFF_METADATA.iter().filter(|m| m.direction == "request").count();
            let responses = SNIFF_METADATA.iter().filter(|m| m.direction == "response").count();
            format!(r#"{{"enabled":{},"raw_request_count":{},"raw_response_count":{},"metadata_count":{},"request_count":{},"response_count":{},"last_id":{},"raw_limit":{},"metadata_limit":{}}}"#,
                SNIFF_ENABLED.load(Ordering::Relaxed), SNIFF_REQUESTS.len(), SNIFF_RESPONSES.len(),
                SNIFF_METADATA.len(), requests, responses, last_id, SNIFF_RAW_MAX, SNIFF_METADATA_MAX)
        }
    } else if path == "/api/sniff/metadata" {
        let after_id = parse_query(&full_uri, "after_id").parse::<u64>().unwrap_or(0);
        let _lock = SNIFF_MUTEX.lock();
        unsafe {
            let entries: Vec<String> = SNIFF_METADATA.iter()
                .filter(|m| m.id > after_id)
                .map(|m| format!(r#"{{"id":{},"request_id":{},"timestamp_ms":{},"direction":"{}","path":"{}","size":{}}}"#,
                    m.id, m.request_id, m.timestamp_ms, m.direction, json_escape(&m.path), m.size))
                .collect();
            let last_id = SNIFF_METADATA.last().map(|m| m.id).unwrap_or(after_id);
            format!(r#"{{"enabled":{},"after_id":{},"last_id":{},"count":{},"entries":[{}]}}"#,
                SNIFF_ENABLED.load(Ordering::Relaxed), after_id, last_id, entries.len(), entries.join(","))
        }
'''
          s=s.replace(marker,routes+marker,1)

          # Clear all rings and pairing state, while keeping ids monotonic for incremental readers.
          sub(r'''SNIFF_REQUESTS\.clear\(\);\n\s*SNIFF_RESPONSES\.clear\(\);''','''SNIFF_REQUESTS.clear();
            SNIFF_RESPONSES.clear();
            SNIFF_METADATA.clear();
            SNIFF_RESPONSE_QUEUE.clear();
            PENDING_REQ_BODY = None;''')
          s=s.replace(r#'r#"{"ok":true}"#.to_string()'# if False else 'r#"{\"ok\":true}"#.to_string()', 'r#"{\"ok\":true,\"ids_remain_monotonic\":true}"#.to_string()', 1)

          # Response: consume FIFO association and add safe metadata before moving bytes.
          sub(r'''let rid = PENDING_REQ_ID;\n\s*SNIFF_RESPONSES\.push\(\(rid, bytes\)\);\n\s*if SNIFF_RESPONSES\.len\(\) > SNIFF_MAX \{\n\s*SNIFF_RESPONSES\.remove\(0\);\n\s*\}''','''let (rid, response_url) = if SNIFF_RESPONSE_QUEUE.is_empty() {
                    (0, String::new())
                } else {
                    SNIFF_RESPONSE_QUEUE.remove(0)
                };
                push_sniff_metadata(rid, "response", &response_url, bytes.len());
                SNIFF_RESPONSES.push((rid, bytes));
                if SNIFF_RESPONSES.len() > SNIFF_RAW_MAX { SNIFF_RESPONSES.remove(0); }''')

          # Request: metadata and pairing exist even when the body parking failed.
          old='''            // Try to match parked request body
            if let Some(body) = PENDING_REQ_BODY.take() {
                let headers_json = format_headers_json(&req_headers);
                let url_str = game_url.clone().unwrap_or_default();
                let _lock = SNIFF_MUTEX.lock();
                SNIFF_REQUESTS.push((rid, url_str, headers_json, body));
                if SNIFF_REQUESTS.len() > SNIFF_MAX {
                    SNIFF_REQUESTS.remove(0);
                }
            }
            PENDING_URL = game_url.clone().unwrap_or_default();'''
          new='''            let body = PENDING_REQ_BODY.take().unwrap_or_default();
            let headers_json = format_headers_json(&req_headers);
            let url_str = game_url.clone().unwrap_or_default();
            {
                let _lock = SNIFF_MUTEX.lock();
                push_sniff_metadata(rid, "request", &url_str, body.len());
                SNIFF_RESPONSE_QUEUE.push((rid, url_str.clone()));
                if SNIFF_RESPONSE_QUEUE.len() > SNIFF_METADATA_MAX { SNIFF_RESPONSE_QUEUE.remove(0); }
                SNIFF_REQUESTS.push((rid, url_str, headers_json, body));
                if SNIFF_REQUESTS.len() > SNIFF_RAW_MAX { SNIFF_REQUESTS.remove(0); }
            }
            PENDING_URL = game_url.clone().unwrap_or_default();'''
          if s.count(old)!=1: raise SystemExit('request block mismatch')
          s=s.replace(old,new,1)

          # Guard that the obsolete capacity is gone.
          if 'SNIFF_MAX' in s: raise SystemExit('obsolete SNIFF_MAX remains')
          p.write_text(s)

          cargo=Path('hachimi_ura_plugin/Cargo.toml')
          c=cargo.read_text()
          c,n=re.subn(r'(?m)^version = "[^"]+"', 'version = "3.25.0"', c, count=1)
          if n!=1: raise SystemExit('version marker mismatch')
          cargo.write_text(c)
          PY
          python3 /tmp/patch.py
          cd hachimi_ura_plugin
          cargo fmt
          cargo check
      - name: Commit to feature branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hachimi_ura_plugin/src/lib.rs hachimi_ura_plugin/Cargo.toml hachimi_ura_plugin/Cargo.lock
          git commit -m 'feat: upgrade sniff API for long incremental capture'
          git push origin HEAD:workbench/sniff-v2
