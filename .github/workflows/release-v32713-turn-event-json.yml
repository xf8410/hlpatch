name: Release v3.27.13 Ordered Turn Event JSON

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/next-generation-so-foundation-20260808
          fetch-depth: 0

      - name: Validate qualified source identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git merge-base --is-ancestor 83549f60917360a3b465916f921860cd2791e299 "$GITHUB_SHA"
          python3 scripts/run_generated_succession_l_cumulative.py
          grep -Fq 'Ordered turn and event JSON export C1' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'fn storage_turn_event_jsons' hachimi_ura_plugin/src/lib.rs
          grep -Fq '"/storage/turn_event_jsons"' hachimi_ura_plugin/src/lib.rs
          cargo generate-lockfile --manifest-path hachimi_ura_plugin/Cargo.toml
          grep -Fq 'name = "rmpv"' hachimi_ura_plugin/Cargo.lock
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('hachimi_ura_plugin/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text = text.replace('version = "3.27.11"', 'version = "3.27.13"', 1)
          cargo.write_text(text, encoding='utf-8')
          lock = Path('hachimi_ura_plugin/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          text = text.replace('name = "hachimi_ura"\nversion = "3.27.11"', 'name = "hachimi_ura"\nversion = "3.27.13"', 1)
          lock.write_text(text, encoding='utf-8')
          PY
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.13"
          grep -Fq 'name = "hachimi_ura"' hachimi_ura_plugin/Cargo.lock
          grep -Fq 'version = "3.27.13"' hachimi_ura_plugin/Cargo.lock

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          HLPATCH_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee release-v32713-cargo.log

      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          cargo_version=3.27.13
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.13
          workflow_run=${GITHUB_RUN_ID}
          features=ordered_turn_event_json,messagepack_decode,historical_session_filter,pagination,source_trace
          ci_qualification_run=31562677447
          ci_qualification_sha=83549f60917360a3b465916f921860cd2791e299
          runtime_validation=pending_device_execution
          EOF

      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          git tag -a v3.27.13 "$GITHUB_SHA" -m "Release v3.27.13"
          git push origin refs/tags/v3.27.13
          gh release create v3.27.13 \
            --verify-tag \
            --title v3.27.13 \
            --notes "Adds /storage/turn_event_jsons for ordered MessagePack-to-JSON extraction from historical SO sessions. It selects responses whose data contains chara_info and any *_data_set, keeps unchecked_event_array in the same record, preserves response receive order, supports pagination, and retains source references. Qualified by run 31562677447 at 83549f60917360a3b465916f921860cd2791e299." \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt

      - name: Verify published identity and asset digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          RELEASE_JSON=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.13)
          test "$(git rev-list -n1 v3.27.13)" = "$GITHUB_SHA"
          test "$(printf '%s' "$RELEASE_JSON" | jq '[.assets[] | select(.name == "libhachimi_ura.so")] | length')" = "1"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .digest')" = "sha256:$SHA256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libhachimi_ura-v3.27.13-run-${{ github.run_id }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/release-v32713-cargo.log
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: warn
