name: Cleanup stale release mutation paths

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove stale tracked binaries and one-time workflows
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f --ignore-unmatch \
            libhachimi_ura.so \
            libhachimi_ura/libhachimi_ura.so \
            .github/workflows/repair-v3.25.1-release.yml \
            .github/workflows/run-md5log-workbench-patch.yml \
            .github/workflows/cleanup-release-consistency.yml
          git commit -m "chore: remove stale SO copies and one-time mutation workflows"
          git push origin HEAD:main
