name: Release v3.27.9 Generated Succession L
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 594e6292f873990c254bb37cb65eb4efcb4c4384
          fetch-depth: 0
      - name: Validate immutable source and apply A-L twice
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "594e6292f873990c254bb37cb65eb4efcb4c4384"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.9"
          python3 scripts/run_generated_succession_l_cumulative.py
          S=hachimi_ura_plugin/src/lib.rs
          test "$(grep -c 'path == \"/generate_succession/runtime_full\"' "$S")" = 1
          grep -Fq 'Gallop.WorkTrainedCharaData/SupportCardData' "$S"
          grep -Fq 'get_SupportCardId' "$S"
          grep -Fq 'get_LimitBreakCount' "$S"
          grep -Fq 'get_SingleWinNum' "$S"
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist|truncate|preview' scripts/apply_generated_succession_runtime_l.py scripts/apply_generated_succession_runtime_l_support_fix.py
      - name: Refuse overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ! gh release view v3.27.9 >/dev/null 2>&1
          ! git ls-remote --exit-code --tags origin refs/tags/v3.27.9 >/dev/null 2>&1
      - name: Setup Rust
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true
      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --target aarch64-linux-android --release
      - name: Publish immutable Release and verify digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=594e6292f873990c254bb37cb65eb4efcb4c4384
          cargo_version=3.27.9
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.9
          workflow_run=${GITHUB_RUN_ID}
          endpoint=/generate_succession/runtime_full
          cumulative_patches=A,B,C,D,E,F,G,H,I,J,K,L
          ci_qualification_run=31132594992
          runtime_validation=pending_device_execution
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v3.27.9 594e6292f873990c254bb37cb65eb4efcb4c4384 -m 'Release v3.27.9'
          git push origin refs/tags/v3.27.9
          gh release create v3.27.9 --verify-tag --title v3.27.9 --notes "Adds /generate_succession/runtime_full for complete in-memory generated succession result decoding: generated position, character identity, scenario, ten aptitude values, total races and wins, all factors, support card positions/IDs/limit breaks, and complete race-history entries. CI qualification: run 31132594992." "$ASSET" SHA256SUMS BUILD-MANIFEST.txt
          API_DIGEST=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.9 --jq '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$API_DIGEST" = "sha256:$SHA256"
      - uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-v3.27.9
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
