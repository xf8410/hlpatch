name: Release v3.27.8 Unified K

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7f1a5854f47cac8d1658a6fdcac5ae9c16d7146a
          fetch-depth: 0

      - name: Validate immutable source and apply A-K twice
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7f1a5854f47cac8d1658a6fdcac5ae9c16d7146a"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.8"
          python3 scripts/fix_unified_endpoint_k_complete_anchors.py
          python3 scripts/fix_unified_endpoint_k_rust_types.py
          for pass in 1 2; do
            python3 scripts/fix_unified_endpoint_f_patch_anchors.py
            python3 scripts/apply_unified_endpoint_a_patch.py
            python3 scripts/apply_unified_endpoint_a_compile_fix.py
            python3 scripts/apply_unified_endpoint_b_storage_patch.py
            python3 scripts/apply_unified_endpoint_b_storage_compile_fix.py
            python3 scripts/apply_unified_endpoint_c_inherit_pair_patch.py
            python3 scripts/apply_unified_endpoint_d_selected_parent_patch.py
            python3 scripts/apply_unified_endpoint_e_runtime_correction.py
            python3 scripts/apply_unified_endpoint_f_pre_release_fix.py
            python3 scripts/apply_unified_endpoint_g_release_gate_fix.py
            python3 scripts/apply_unified_endpoint_h_response_headers.py
            python3 scripts/apply_unified_endpoint_i_parent_multisource.py
            python3 scripts/apply_unified_endpoint_j_parent_runtime_semantics.py
            python3 scripts/apply_unified_endpoint_k_complete.py
            sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1 > source-$pass.sha
          done
          cmp source-1.sha source-2.sha

      - name: Audit K contracts and implementation boundaries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hachimi_ura_plugin/src/lib.rs').read_text()
          required=[
            'fn storage_files_endpoint', 'fn storage_download',
            'unsafe fn il2cpp_call_targets', 'unsafe fn il2cpp_callers',
            'unsafe fn il2cpp_type_detail', 'unsafe fn il2cpp_object_dump',
            'unsafe fn inherit_tree_endpoint() -> String { inherit_selected_parent_records_endpoint() }',
            'fn k_domain_endpoint', 'k_observation_files(path.trim_start_matches',
            'inherit_selected_parent_records_endpoint', 'persist_protocol_capture',
            'observe_unity_response_completion', 'GetResponseHeaders',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, missing
          routes='''/storage/files /storage/download /il2cpp/call_targets /il2cpp/callers /il2cpp/type_detail /il2cpp/object_dump /inherit/tree /inherit/parent_records /autoplay/runtime /offline_auto/runtime /generate_succession/status /factor/history /api/sniff/exchanges /api/hook/list'''.split()
          bad=[x for x in routes if s.count(f'path == "{x}"') != 1]
          assert not bad, bad
          PY
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist|truncate|preview' \
            scripts/apply_unified_endpoint_k_complete.py \
            scripts/fix_unified_endpoint_k_complete_anchors.py \
            scripts/fix_unified_endpoint_k_rust_types.py

      - name: Refuse overwrite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.27.8 >/dev/null 2>&1; then
            echo 'release v3.27.8 already exists; refusing overwrite' >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v3.27.8 >/dev/null 2>&1; then
            echo 'tag v3.27.8 already exists; refusing overwrite' >&2
            exit 1
          fi

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --target aarch64-linux-android --release

      - name: Create immutable tag, publish Release, and verify digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=7f1a5854f47cac8d1658a6fdcac5ae9c16d7146a
          cargo_version=3.27.8
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.8
          workflow_run=${GITHUB_RUN_ID}
          endpoint_stage=K-observation-routing
          cumulative_patches=A,B,C,D,E,F,G,H,I,J,K
          dedicated_handlers=storage_files,storage_download,il2cpp_call_targets,il2cpp_callers,il2cpp_type_detail,il2cpp_object_dump
          generic_observation_file_routing=inherit_extensions,autoplay,offline_auto,generate_succession,factor,sniff_exchange,hook_routes
          runtime_validation=pending_device_execution
          EOF
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v3.27.8 7f1a5854f47cac8d1658a6fdcac5ae9c16d7146a -m 'Release v3.27.8'
          git push origin refs/tags/v3.27.8
          NOTES=$(cat <<EOF
          Unified observation release through K routing stage.

          Dedicated K handlers: storage file listing/download and bounded single-target IL2CPP call-target, caller, type-detail, and object-field inspection.

          Implementation boundary: inheritance extensions, autoplay/offline-auto, generate-succession, factor, sniff-exchange, and hook routes currently query persisted observation files through the generic K domain handler; they are not complete business-domain parsers or hook controllers.

          Source commit: 7f1a5854f47cac8d1658a6fdcac5ae9c16d7146a
          Cargo version: 3.27.8
          Binary size: $SIZE bytes
          SHA-256: $SHA256
          Workflow run: $GITHUB_RUN_ID
          EOF
          )
          gh release create v3.27.8 --verify-tag --title v3.27.8 --notes "$NOTES" \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt
          API_DIGEST=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.8 \
            --jq '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$API_DIGEST" = "sha256:$SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-v3.27.8
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
