name: Fix v3.27.12 release lock refresh

on:
  push:
    branches:
      - workbench/next-generation-so-foundation-20260808
    paths:
      - .github/workflows/fix-v32712-lock-refresh.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the diagnosed build-mode correction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/release-v32712-storage-read-range.yml')
          text = path.read_text(encoding='utf-8')
          old = '          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee release-v32712-cargo.log\n'
          new = '          cargo build --target aarch64-linux-android --release 2>&1 | tee release-v32712-cargo.log\n          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee -a release-v32712-cargo.log\n'
          if text.count(old) != 1:
              raise RuntimeError(f'release build anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff -- .github/workflows/release-v32712-storage-read-range.yml

      - name: Commit one build correction
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/release-v32712-storage-read-range.yml
          git diff --cached --quiet && exit 1
          git commit -m 'fix: refresh v3.27.12 dependency lock before locked build'
          git push origin HEAD:${GITHUB_REF_NAME}
