name: Diagnose meta.sqlcipher gate (read-only source audit)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Locate meta.sqlcipher / ura_meta_key / disabled_v anchors in production source
        run: |
          set -uo pipefail
          F=hachimi_ura_plugin/src/lib.rs
          echo "=== file size ==="
          wc -c "$F"
          echo "=== all occurrences: meta.sqlcipher (with 8 lines context) ==="
          grep -n -C8 'meta\.sqlcipher' "$F" || echo 'no literal meta.sqlcipher'
          echo "=== all occurrences: ura_meta_key (with 8 lines context) ==="
          grep -n -C8 'ura_meta_key' "$F" || echo 'no literal ura_meta_key'
          echo "=== all occurrences: disabled_v (with 4 lines context) ==="
          grep -n -C4 'disabled_v' "$F" || echo 'no literal disabled_v'
          echo "=== case-insensitive sqlcipher sweep (line numbers only) ==="
          grep -n -i 'sqlcipher' "$F" | head -60 || echo 'no sqlcipher anywhere'
          echo "=== resource_meta_key route handler context ==="
          grep -n -C6 'resource_meta_key' "$F" | head -120 || echo 'no resource_meta_key'
          echo "=== sqlite3_key references (line numbers only) ==="
          grep -n -i 'sqlite3_key' "$F" | head -40 || echo 'no sqlite3_key references'
          echo "=== git log touching meta/sqlcipher (last 20) ==="
          git log --oneline -20 -i --grep='sqlcipher' || true
          git log --oneline -20 -i --grep='meta_key' || true
          echo "=== which release workflow first mentions disabled_v3.24.57 ==="
          git grep -n 'disabled_v3\.24\.57' $(git rev-list --all --max-count=200) -- 2>/dev/null | head -20 || echo 'not found in last 200 commits'

      - name: Summary
        run: echo "diagnosis complete - see log above"
