name: Diagnose meta.sqlcipher gate (read-only source audit v2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Dump sqlcipher hook section and flag-file logic
        run: |
          set -uo pipefail
          F=hachimi_ura_plugin/src/lib.rs
          echo "=== total lines ==="
          wc -l "$F"
          echo "=== sqlcipher section: lines 12280-12520 (verbatim) ==="
          sed -n '12280,12520p' "$F"
          echo "=== flag file path candidates (grep -a, case-insensitive) ==="
          grep -a -n -i -E 'sqlcipher[_-]?flag|flag[_-]?file|flag[_-]?path|enable.*sqlcipher|sqlcipher.*enable|\.sqlcipher|media.*dir.*flag|getExternalStorage|/storage/emulated' "$F" | head -60
          echo "=== set_hook_status sqlcipher call sites ==="
          grep -a -n -B6 -A20 'set_hook_status("meta.sqlcipher"' "$F" | head -200
          echo "=== v3.24.59 safe-subset comment block ==="
          grep -a -n -B4 -A30 'safe sqlcipher hook subset\|skip open_v2/key\|Hachimi-owned' "$F" | head -160
