name: Build Hachimi URA Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v3-25-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source and reserve immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.25.2
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          test "$TAG" = "v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to move it" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists; refusing to overwrite it" >&2
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA"

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build exact main source
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --locked --target aarch64-linux-android --release

      - name: Publish v3.25.2
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.25.2
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          SOURCE_SHA=$(git rev-parse HEAD)
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$SOURCE_SHA
          cargo_version=3.25.2
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=$TAG
          workflow_run=$GITHUB_RUN_ID
          EOF
          gh release create "$TAG" --verify-tag --latest --title "$TAG" \
            --notes "Current hlpatch release built from main commit $SOURCE_SHA. Binary size: $SIZE bytes. SHA-256: $SHA256. Workflow run: $GITHUB_RUN_ID." \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt

      - name: Verify published asset digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v3.25.2
        run: |
          set -euo pipefail
          EXPECTED=$(cut -d' ' -f1 SHA256SUMS)
          ACTUAL=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$ACTUAL" = "sha256:$EXPECTED"
