name: Build Hachimi URA Plugin

on:
  push:
    branches: [main]
    paths:
      - "hachimi_ura_plugin/**"
      - ".github/workflows/build-ura.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable sniff by default for this build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path("hachimi_ura_plugin/src/lib.rs")
          text = src.read_text()
          old = "static SNIFF_ENABLED: AtomicBool = AtomicBool::new(false);"
          new = "static SNIFF_ENABLED: AtomicBool = AtomicBool::new(true);"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one SNIFF_ENABLED=false, got {text.count(old)}")
          src.write_text(text.replace(old, new, 1))

          cargo = Path("hachimi_ura_plugin/Cargo.toml")
          manifest = cargo.read_text()
          manifest, count = re.subn(r'(?m)^version = "[^"]+"', 'version = "3.24.75-sniff-on"', manifest, count=1)
          if count != 1:
              raise SystemExit("Cargo version marker mismatch")
          cargo.write_text(manifest)
          PY
          grep -F 'static SNIFF_ENABLED: AtomicBool = AtomicBool::new(true);' hachimi_ura_plugin/src/lib.rs

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --target aarch64-linux-android --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-sniff-on
          path: hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so

      - name: Publish dedicated release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3.24.75-sniff-on"
          ASSET="hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Temporary diagnostic build: API sniffing enabled at plugin startup."
          gh release upload "$TAG" "$ASSET" --clobber
