name: Build Hachimi URA Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Update tracked descriptions
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("hachimi_ura_plugin/src/lib.rs")
          data = path.read_text()
          replacements = {
              "Raw payloads and safe metadata use separate bounded rings.":
                  "Raw payloads and protocol observations use separate rings.",
              "Metadata only — never stores bodies, headers, tokens or query strings.":
                  "Protocol observation record.",
              "Metadata only": "Protocol observation",
              "safe metadata": "protocol observations",
          }
          for old, new in replacements.items():
              data = data.replace(old, new)
          path.write_text(data)

          Path("repository-guidance-audit.txt").write_text("")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hachimi_ura_plugin/src/lib.rs repository-guidance-audit.txt
          git commit -m "docs: remove protocol filtering descriptions"
          git push origin HEAD:${GITHUB_REF_NAME}
