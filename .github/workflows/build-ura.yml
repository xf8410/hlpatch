name: Build Hachimi URA Plugin
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-response-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/unified-observation-endpoint-implementation-20260806
      - name: Extract bounded response-header contexts
        run: python3 scripts/extract_response_header_hook_context.py
      - name: Commit context
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/RESPONSE_HEADER_HOOK_SOURCE_CONTEXT.md
          git commit -m 'chore: capture response header hook source context' || true
          git push origin HEAD:workbench/unified-observation-endpoint-implementation-20260806
