name: Publish Hachimi URA v3.27.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d85f185b69626ed6f864fa6def36c69a2b9f3be
          fetch-depth: 0

      - name: Validate release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5d85f185b69626ed6f864fa6def36c69a2b9f3be"
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          test "$VERSION" = "3.27.4"

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build tagged source
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --locked --target aarch64-linux-android --release

      - name: Publish immutable v3.27.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=5d85f185b69626ed6f864fa6def36c69a2b9f3be
          cargo_version=3.27.4
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.4
          workflow_run=${GITHUB_RUN_ID}
          EOF
          if git rev-parse -q --verify refs/tags/v3.27.4 >/dev/null; then
            test "$(git rev-list -n1 v3.27.4)" = "5d85f185b69626ed6f864fa6def36c69a2b9f3be"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a v3.27.4 5d85f185b69626ed6f864fa6def36c69a2b9f3be -m "Release v3.27.4"
            git push origin refs/tags/v3.27.4
          fi
          if gh release view v3.27.4 >/dev/null 2>&1; then
            echo "v3.27.4 already exists" >&2
            exit 1
          fi
          gh release create v3.27.4 --verify-tag --title v3.27.4 \
            --notes "IL2CPP live parameter signatures, declaring-type nested-class lookup, and guarded static invocation. Source commit: 5d85f185b69626ed6f864fa6def36c69a2b9f3be" \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt
          API_DIGEST=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.4 --jq '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$API_DIGEST" = "sha256:$SHA256"
