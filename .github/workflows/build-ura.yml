name: Build Hachimi URA Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-il2cpp-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/add-il2cpp-signature-and-invoke-guards-20260806
      - name: Extract exact function bodies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('hachimi_ura_plugin/src/lib.rs').read_text()
          def extract(start, next_start, out):
              a = s.index(start)
              b = s.index(next_start, a + len(start))
              Path(out).write_text(s[a:b])
          extract('unsafe fn il2cpp_list_methods(', '/// 辅助函数：IL2CPP类型枚举转可读名称', 'tmp_list_methods.rs.txt')
          extract('unsafe fn il2cpp_invoke_static_method(', 'unsafe fn il2cpp_invoke_instance_method(', 'tmp_invoke_static.rs.txt')
          extract('unsafe fn il2cpp_invoke_instance_method(', '// ============================================================', 'tmp_invoke_instance.rs.txt')
          extract('unsafe fn find_class_by_short_name(', '/// Slow fallback:', 'tmp_find_class.rs.txt')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp_*.rs.txt
          git commit -m 'chore: capture focused IL2CPP function bodies'
          git push origin HEAD:workbench/add-il2cpp-signature-and-invoke-guards-20260806
