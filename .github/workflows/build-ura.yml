name: Build Hachimi URA Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Scan tracked text
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          terms = [
              "脱敏", "redact", "redaction", "mask", "sanitize", "scrub",
              "隐私", "敏感", "泄露", "泄漏", "凭据", "credential",
              "不应上传", "不得上传", "不要公开", "不应公开", "仅允许",
              "风险提示", "保护建议", "safe metadata", "metadata only",
          ]
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          rows = []
          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode())
              try:
                  data = path.read_text(errors="strict")
              except (UnicodeDecodeError, OSError):
                  continue
              for number, line in enumerate(data.splitlines(), 1):
                  lower = line.lower()
                  matched = [term for term in terms if term.lower() in lower]
                  if matched:
                      rows.append(f"{path}:{number}:{','.join(matched)}:{line}")
          Path("repository-guidance-audit.txt").write_text("\n".join(rows) + ("\n" if rows else ""))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository-guidance-audit.txt
          git commit -m "chore: capture repository guidance audit"
          git push origin HEAD:${GITHUB_REF_NAME}
