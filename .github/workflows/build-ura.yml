name: Build Hachimi URA Plugin
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/unified-observation-endpoint-implementation-20260806
          fetch-depth: 0
      - name: Restore pre-H workflows from G head
        run: |
          git show f66be5e859fa97b84441ad1171b16ee39f62ca66:.github/workflows/build-ura.yml > .github/workflows/build-ura.yml
          git show f66be5e859fa97b84441ad1171b16ee39f62ca66:.github/workflows/audit-pre-release-endpoint-source.yml > .github/workflows/audit-pre-release-endpoint-source.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-ura.yml .github/workflows/audit-pre-release-endpoint-source.yml
          git commit -m 'ci: restore cumulative build and audit workflows'
          git push origin HEAD:workbench/unified-observation-endpoint-implementation-20260806
