name: Build Hachimi URA Plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-il2cpp-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/add-il2cpp-signature-and-invoke-guards-20260806
      - name: Extract exact source windows
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('hachimi_ura_plugin/src/lib.rs')
          s = p.read_text()
          needles = [
              'return_type_name',
              '/il2cpp/methods',
              'invoke_static',
              'invoke_instance',
              'enumerate_class_methods',
              'FnMethodGetName',
          ]
          out = []
          lines = s.splitlines()
          for needle in needles:
              hits = [i for i, line in enumerate(lines) if needle in line]
              out.append(f'===== {needle} hits={hits} =====')
              for i in hits:
                  lo = max(0, i - 90)
                  hi = min(len(lines), i + 180)
                  out.append(f'----- lines {lo+1}..{hi} -----')
                  out.extend(f'{n+1:07d}: {lines[n]}' for n in range(lo, hi))
          Path('tmp_il2cpp_endpoint_context.txt').write_text('\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp_il2cpp_endpoint_context.txt
          git commit -m 'chore: capture IL2CPP endpoint source context'
          git push origin HEAD:workbench/add-il2cpp-signature-and-invoke-guards-20260806
