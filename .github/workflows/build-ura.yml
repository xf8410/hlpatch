name: Build Hachimi URA Plugin

on:
  push:
    branches:
      - main
      - workbench/unified-observation-endpoint-implementation-20260806
    paths:
      - "hachimi_ura_plugin/**"
      - "scripts/apply_unified_endpoint_a_patch.py"
      - "scripts/apply_unified_endpoint_a_compile_fix.py"
      - ".github/workflows/build-ura.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply A-stage endpoint source patch
        run: |
          set -euo pipefail
          python3 scripts/apply_unified_endpoint_a_patch.py
          python3 scripts/apply_unified_endpoint_a_compile_fix.py
          FIRST_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          python3 scripts/apply_unified_endpoint_a_patch.py
          python3 scripts/apply_unified_endpoint_a_compile_fix.py
          SECOND_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST_SHA" = "$SECOND_SHA"
          grep -Fq 'fn il2cpp_method_by_addr' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'fn il2cpp_method_detail' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'fn il2cpp_nested_types' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'value_status":"unresolved' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'let mut found: *mut c_void = ptr::null_mut();' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'unwrap_or_else(|_| full_uri.to_string())' hachimi_ura_plugin/src/lib.rs

      - name: Audit patch data-preservation paths
        run: |
          set -euo pipefail
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist' \
            scripts/apply_unified_endpoint_a_patch.py \
            scripts/apply_unified_endpoint_a_compile_fix.py

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build exact checked-out source
        id: cargo_build
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          set -o pipefail
          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee a_stage_cargo_build.log

      - name: Persist bounded compiler diagnostics
        if: failure() && steps.cargo_build.outcome == 'failure' && github.ref == 'refs/heads/workbench/unified-observation-endpoint-implementation-20260806'
        run: |
          set -euo pipefail
          {
            echo '# A-stage compiler diagnostics'
            echo
            echo '```text'
            tail -n 240 hachimi_ura_plugin/a_stage_cargo_build.log
            echo '```'
          } > docs/UNIFIED_ENDPOINT_A_BUILD_DIAGNOSTICS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/UNIFIED_ENDPOINT_A_BUILD_DIAGNOSTICS.md
          git commit -m 'chore: capture A-stage compiler diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Generate build manifest
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          SOURCE_SHA=$(git rev-parse HEAD)
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$SOURCE_SHA
          cargo_version=$VERSION
          binary_size=$SIZE
          binary_sha256=$SHA256
          workflow_run=${GITHUB_RUN_ID}
          build_kind=artifact_only
          endpoint_stage=A
          EOF
          cat BUILD-MANIFEST.txt

      - name: Upload immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-${{ github.sha }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
