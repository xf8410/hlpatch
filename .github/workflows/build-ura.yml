name: Publish Hachimi URA v3.27.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/add-il2cpp-signature-and-invoke-guards-20260806

      - name: Capture exact source identity
        id: source
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          test "$VERSION" = "3.27.4"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build exact checked-out source
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --locked --target aarch64-linux-android --release

      - name: Prepare release files
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$SOURCE_SHA
          cargo_version=3.27.4
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.4
          workflow_run=${GITHUB_RUN_ID}
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test -z "$(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName == "v3.27.4") | .tagName')"
          gh release create v3.27.4 \
            --repo "$GITHUB_REPOSITORY" \
            --target workbench/add-il2cpp-signature-and-invoke-guards-20260806 \
            --title v3.27.4 \
            --notes "IL2CPP live parameter signatures, declaring-type nested-class lookup, and guarded static invocation. Source commit: $SOURCE_SHA" \
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so \
            SHA256SUMS \
            BUILD-MANIFEST.txt

      - name: Verify published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NAMES=$(gh release view v3.27.4 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          grep -Fx libhachimi_ura.so <<< "$NAMES"
          grep -Fx SHA256SUMS <<< "$NAMES"
          grep -Fx BUILD-MANIFEST.txt <<< "$NAMES"
