name: Build Hachimi URA Plugin

on:
  push:
    branches: [main]
    paths:
      - "hachimi_ura_plugin/**"
      - ".github/workflows/build-ura.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        run: |
          rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          cargo build --target aarch64-linux-android --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura
          path: hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so

      - name: Get version
        id: version
        run: |
          VERSION=$(grep -oP '^version = "\K[^"]+' hachimi_ura_plugin/Cargo.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          ASSET="hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so"
          for attempt in 1 2 3 4; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$ASSET" --clobber && exit 0
            else
              gh release create "$TAG" --title "$TAG" \
                --notes "Automated plugin build $TAG" && \
              gh release upload "$TAG" "$ASSET" --clobber && exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "Release API failed after retries" >&2
          exit 1
