name: Build Hachimi URA Plugin

on:
  push:
    branches: [main]
    paths:
      - "hachimi_ura_plugin/**"
      - ".github/workflows/build-ura.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Apply runtime invoke fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("hachimi_ura_plugin/src/lib.rs")
          text = path.read_text()

          def replace_between(source: str, start: str, end: str, replacement: str) -> str:
              begin = source.index(start)
              finish = source.index(end, begin)
              return source[:begin] + replacement + "\n\n" + source[finish:]

          type_anchor = 'type FnImageGetClass = unsafe extern "C" fn(*const c_void, u32) -> *mut c_void;\n'
          type_addition = '''type FnDomainGet = unsafe extern "C" fn() -> *mut c_void;
          type FnDomainGetAssemblies =
              unsafe extern "C" fn(*const c_void, *mut usize) -> *mut *const c_void;
          type FnAssemblyGetImage = unsafe extern "C" fn(*const c_void) -> *const c_void;
          '''
          if "type FnDomainGetAssemblies" not in text:
              text = text.replace(type_anchor, type_anchor + type_addition, 1)

          helper_anchor = '/// ★ Get class name directly from an Il2CppClass pointer (no iteration needed)\n'
          helper = '''/// Find an exact namespace/class pair across every loaded IL2CPP assembly.
          /// System.Int32 normally lives in mscorlib.dll rather than umamusume.dll.
          unsafe fn find_class_global(namespace: &str, class_name: &str) -> *mut c_void {
              let domain_get = resolve_il2cpp_symbol("il2cpp_domain_get");
              let domain_get_assemblies = resolve_il2cpp_symbol("il2cpp_domain_get_assemblies");
              let assembly_get_image = resolve_il2cpp_symbol("il2cpp_assembly_get_image");
              if domain_get.is_null()
                  || domain_get_assemblies.is_null()
                  || assembly_get_image.is_null()
              {
                  return ptr::null_mut();
              }

              let get_domain: FnDomainGet = std::mem::transmute(domain_get);
              let get_assemblies: FnDomainGetAssemblies =
                  std::mem::transmute(domain_get_assemblies);
              let get_image: FnAssemblyGetImage = std::mem::transmute(assembly_get_image);
              let domain = get_domain();
              if domain.is_null() {
                  return ptr::null_mut();
              }

              let mut count = 0usize;
              let assemblies = get_assemblies(domain, &mut count);
              if assemblies.is_null() || count == 0 || count > 4096 {
                  return ptr::null_mut();
              }

              let namespace_c = to_cstr(namespace);
              let class_name_c = to_cstr(class_name);
              for index in 0..count {
                  let assembly = *assemblies.add(index);
                  if assembly.is_null() {
                      continue;
                  }
                  let image = get_image(assembly);
                  if image.is_null() {
                      continue;
                  }
                  let class = find_class(image, namespace_c.as_ptr(), class_name_c.as_ptr());
                  if !class.is_null() {
                      return class;
                  }
              }
              ptr::null_mut()
          }

          '''
          if "unsafe fn find_class_global(" not in text:
              text = text.replace(helper_anchor, helper + helper_anchor, 1)

          getter_replacement = '''unsafe fn call_getter_int_with_arg(
              class: *mut c_void,
              instance: *const c_void,
              method_name: &str,
              int_arg: i32,
          ) -> i32 {
              if class.is_null() || instance.is_null() {
                  return -1;
              }
              let get_method_ptr = resolve_il2cpp_symbol("il2cpp_class_get_method_from_name");
              let invoke_ptr = resolve_il2cpp_symbol("il2cpp_runtime_invoke");
              if get_method_ptr.is_null() || invoke_ptr.is_null() {
                  return -1;
              }
              let get_method: FnClassGetMethodFromName = std::mem::transmute(get_method_ptr);
              let invoke: FnRuntimeInvoke = std::mem::transmute(invoke_ptr);
              let method_info = get_method(class, to_cstr(method_name).as_ptr(), 1);
              if method_info.is_null() {
                  ura_log(4, &format!("call_int_with_arg: '{}' not found", method_name));
                  return -1;
              }

              // il2cpp_runtime_invoke expects argv entries to point to unboxed value data.
              let mut arg = int_arg;
              let mut args = [&mut arg as *mut i32 as *mut c_void];
              let mut exc: *mut c_void = ptr::null_mut();
              let result = invoke(
                  method_info,
                  instance as *mut c_void,
                  args.as_mut_ptr(),
                  &mut exc,
              );
              if !exc.is_null() || result.is_null() {
                  return -1;
              }
              std::ptr::read_unaligned::<i32>((result as *const u8).add(16) as *const i32)
          }
          '''
          text = replace_between(
              text,
              "unsafe fn call_getter_int_with_arg(",
              "/// ★ ObscuredInt getter:",
              getter_replacement,
          )

          static_replacement = '''unsafe fn il2cpp_invoke_static_method(
              class_name: &str,
              method_name: &str,
              p0: i64,
              p1: i64,
              p2: i64,
              p3: i64,
              p4: i64,
              param_count: i32,
          ) -> String {
              if class_name.is_empty() || method_name.is_empty() {
                  return r#"{\"error\":\"missing ?class= or ?method=\"}"#.to_string();
              }
              if !(0..=5).contains(&param_count) {
                  return r#"{\"error\":\"param_count_out_of_range\"}"#.to_string();
              }
              let image = get_image();
              if image.is_null() {
                  return r#"{\"error\":\"image_null\"}"#.to_string();
              }
              let class = find_class_by_short_name(image, class_name);
              if class.is_null() {
                  return format!(r#"{{\"error\":\"class_not_found\",\"name\":\"{}\"}}"#, class_name);
              }

              let get_method_ptr = resolve_il2cpp_symbol("il2cpp_class_get_method_from_name");
              let invoke_ptr = resolve_il2cpp_symbol("il2cpp_runtime_invoke");
              if get_method_ptr.is_null() || invoke_ptr.is_null() {
                  return r#"{\"error\":\"runtime_symbols_not_found\"}"#.to_string();
              }
              let get_method: FnClassGetMethodFromName = std::mem::transmute(get_method_ptr);
              let invoke: FnRuntimeInvoke = std::mem::transmute(invoke_ptr);
              let method_info = get_method(class, to_cstr(method_name).as_ptr(), param_count);
              if method_info.is_null() {
                  return format!(r#"{{\"error\":\"method_not_found\",\"class\":\"{}\",\"method\":\"{}\",\"params\":{}}}"#, class_name, method_name, param_count);
              }

              // This endpoint accepts i32-compatible value parameters only.
              // runtime_invoke wants pointers to raw values, not boxed Int32 objects.
              let mut raw_args = [p0 as i32, p1 as i32, p2 as i32, p3 as i32, p4 as i32];
              let mut argv: [*mut c_void; 5] = [ptr::null_mut(); 5];
              for index in 0..param_count as usize {
                  argv[index] = &mut raw_args[index] as *mut i32 as *mut c_void;
              }
              let argv_ptr = if param_count == 0 {
                  ptr::null_mut()
              } else {
                  argv.as_mut_ptr()
              };
              let mut exc: *mut c_void = ptr::null_mut();
              let result = invoke(method_info, ptr::null_mut(), argv_ptr, &mut exc);
              if !exc.is_null() {
                  return format!(r#"{{\"ok\":false,\"class\":\"{}\",\"method\":\"{}\",\"error\":\"exception\",\"exc_addr\":\"0x{:x}\"}}"#, class_name, method_name, exc as usize);
              }
              format!(r#"{{\"ok\":true,\"class\":\"{}\",\"method\":\"{}\",\"params\":{},\"result_addr\":\"0x{:x}\"}}"#, class_name, method_name, param_count, result as usize)
          }
          '''
          text = replace_between(
              text,
              "unsafe fn il2cpp_invoke_static_method(",
              "/// /il2cpp/invoke_instance",
              static_replacement,
          )

          instance_replacement = '''unsafe fn il2cpp_invoke_instance_method(
              class_name: &str,
              method_name: &str,
              object_addr: &str,
              p0: i64,
              p1: i64,
              p2: i64,
              p3: i64,
              p4: i64,
              param_count: i32,
          ) -> String {
              if class_name.is_empty() || method_name.is_empty() {
                  return r#"{\"error\":\"missing ?class= or ?method=\"}"#.to_string();
              }
              if !(0..=5).contains(&param_count) {
                  return r#"{\"error\":\"param_count_out_of_range\"}"#.to_string();
              }
              let obj_addr = usize::from_str_radix(object_addr.trim_start_matches("0x"), 16).unwrap_or(0);
              if obj_addr == 0 {
                  return r#"{\"error\":\"missing or invalid ?object= parameter\"}"#.to_string();
              }
              let image = get_image();
              if image.is_null() {
                  return r#"{\"error\":\"image_null\"}"#.to_string();
              }
              let class = find_class_by_short_name(image, class_name);
              if class.is_null() {
                  return format!(r#"{{\"error\":\"class_not_found\",\"name\":\"{}\"}}"#, class_name);
              }

              let get_method_ptr = resolve_il2cpp_symbol("il2cpp_class_get_method_from_name");
              let invoke_ptr = resolve_il2cpp_symbol("il2cpp_runtime_invoke");
              if get_method_ptr.is_null() || invoke_ptr.is_null() {
                  return r#"{\"error\":\"runtime_symbols_not_found\"}"#.to_string();
              }
              let get_method: FnClassGetMethodFromName = std::mem::transmute(get_method_ptr);
              let invoke: FnRuntimeInvoke = std::mem::transmute(invoke_ptr);
              let method_info = get_method(class, to_cstr(method_name).as_ptr(), param_count);
              if method_info.is_null() {
                  return format!(r#"{{\"error\":\"method_not_found\",\"class\":\"{}\",\"method\":\"{}\",\"params\":{}}}"#, class_name, method_name, param_count);
              }

              let mut raw_args = [p0 as i32, p1 as i32, p2 as i32, p3 as i32, p4 as i32];
              let mut argv: [*mut c_void; 5] = [ptr::null_mut(); 5];
              for index in 0..param_count as usize {
                  argv[index] = &mut raw_args[index] as *mut i32 as *mut c_void;
              }
              let argv_ptr = if param_count == 0 {
                  ptr::null_mut()
              } else {
                  argv.as_mut_ptr()
              };
              let mut exc: *mut c_void = ptr::null_mut();
              let result = invoke(
                  method_info,
                  obj_addr as *mut c_void,
                  argv_ptr,
                  &mut exc,
              );
              if !exc.is_null() {
                  return format!(r#"{{\"ok\":false,\"class\":\"{}\",\"method\":\"{}\",\"error\":\"exception\",\"exc_addr\":\"0x{:x}\"}}"#, class_name, method_name, exc as usize);
              }
              format!(r#"{{\"ok\":true,\"class\":\"{}\",\"method\":\"{}\",\"object\":\"0x{:x}\",\"params\":{},\"result_addr\":\"0x{:x}\"}}"#, class_name, method_name, obj_addr, param_count, result as usize)
          }
          '''
          text = replace_between(
              text,
              "unsafe fn il2cpp_invoke_instance_method(",
              "/// /il2cpp/call_static",
              instance_replacement,
          )

          # Keep a global exact lookup available for System.Int32 and future typed calls.
          assert 'find_class_global("System", "Int32")' not in text
          text = text.replace(
              'let image = match get_image() {\n        img if !img.is_null() => img,\n        _ => return -1,\n    };\n    let int32_class = find_class_by_short_name(image, "Int32");',
              'let int32_class = find_class_global("System", "Int32");',
              1,
          ) if 'call_int_with_arg: Int32 class not found' in text else text

          path.write_text(text)

          for manifest in [Path("hachimi_ura_plugin/Cargo.toml"), Path("hachimi_ura_plugin/Cargo.lock")]:
              data = manifest.read_text()
              data = data.replace('version = "3.27.2"', 'version = "3.27.3"', 1)
              manifest.write_text(data)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hachimi_ura_plugin/src/lib.rs hachimi_ura_plugin/Cargo.toml hachimi_ura_plugin/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "fix: pass unboxed i32 argv to il2cpp_runtime_invoke"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build exact checked-out source
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --locked --target aarch64-linux-android --release
