name: Build Hachimi URA Plugin

on:
  push:
    branches:
      - main
      - workbench/unified-observation-endpoint-implementation-20260806
      - workbench/next-generation-so-foundation-20260808
    paths:
      - "hachimi_ura_plugin/**"
      - "scripts/**"
      - ".github/workflows/build-ura.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate exact cumulative v3.27.11 source
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.11"
          grep -Fq 'name = "hachimi_ura"' hachimi_ura_plugin/Cargo.lock
          grep -Fq 'version = "3.27.11"' hachimi_ura_plugin/Cargo.lock
          grep -Fq 'Protocol archive reliability P-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Protocol multi-section event timeline O-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Hachimi TextCommon final display observer N-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Ramen/Hachimi global durable observation M-stage' hachimi_ura_plugin/src/lib.rs

      - name: Audit changed implementation scripts for forbidden data-loss paths
        run: |
          set -euo pipefail
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist' \
            scripts/apply_ramen_global_durable_observation.py \
            scripts/apply_hachimi_textcommon_observer.py \
            scripts/apply_protocol_multisection_event_timeline.py \
            scripts/apply_protocol_archive_reliability_p.py

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Refresh cumulative dependency lock and build generated source
        id: cargo_build
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          set -o pipefail
          cargo build --target aarch64-linux-android --release 2>&1 | tee next-generation-foundation-cargo.log
          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee -a next-generation-foundation-cargo.log

      - name: Persist bounded compiler diagnostics
        if: failure() && steps.cargo_build.outcome == 'failure' && github.ref == 'refs/heads/workbench/next-generation-so-foundation-20260808'
        run: |
          set -euo pipefail
          {
            echo '# Next-generation SO foundation compiler diagnostics'
            echo
            echo '```text'
            tail -n 240 hachimi_ura_plugin/next-generation-foundation-cargo.log
            echo '```'
          } > docs/NEXT_GENERATION_SO_FOUNDATION_BUILD_DIAGNOSTICS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/NEXT_GENERATION_SO_FOUNDATION_BUILD_DIAGNOSTICS.md
          git commit -m 'chore: capture next-generation foundation compiler diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Generate build manifest
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          SOURCE_SHA=$(git rev-parse HEAD)
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$SOURCE_SHA
          cargo_version=$VERSION
          binary_size=$SIZE
          binary_sha256=$SHA256
          workflow_run=${GITHUB_RUN_ID}
          build_kind=artifact_only
          endpoint_stage=next_generation_foundation_baseline
          dependency_lock=refreshed_then_verified_locked
          runtime_validation=pending_device_execution
          EOF
          cat BUILD-MANIFEST.txt

      - name: Upload immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-next-generation-foundation-${{ github.sha }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/next-generation-foundation-cargo.log
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
