name: Build Hachimi URA Plugin

on:
  push:
    branches: [main]
    paths:
      - "hachimi_ura_plugin/**"
      - ".github/workflows/build-ura.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture targeted hook context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hachimi_ura_plugin/src/lib.rs')
          lines=p.read_text().splitlines()
          terms=[
            'install_api_sniff_hooks', 'hook_compress', 'hook_decompress',
            'hook_post', 'COMPRESS_REQUEST_ADDR', 'DECOMPRESS_RESPONSE_ADDR',
            'POST_ADDR', 'il2cpp_get_method_addr_fn', 'get_method_addr',
            'interceptor_hook_fn', 'interceptor_get_trampoline_addr_fn',
            '/api/sniff/diag', 'fn format_headers_json', 'PENDING_REQ_BODY'
          ]
          selected=[]
          seen=set()
          for term in terms:
            hits=[i for i,x in enumerate(lines) if term in x]
            selected.append(f'## `{term}` hits={len(hits)}')
            for i in hits:
              a=max(0,i-18); b=min(len(lines),i+45)
              key=(a,b)
              if key in seen: continue
              seen.add(key)
              selected += ['```rust']+[f'{j+1}: {lines[j]}' for j in range(a,b)]+['```']
          out=Path('docs/unitywebrequest-hook-context.md')
          out.write_text('# Targeted UnityWebRequest hook insertion context\n\n'+'\n'.join(selected)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/unitywebrequest-hook-context.md
          git commit -m 'docs: capture targeted auth hook context' || true
          git push origin HEAD:workbench/unitywebrequest-auth-observer

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build baseline
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --target aarch64-linux-android --release

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-auth-observer-baseline
          path: hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
