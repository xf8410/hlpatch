name: Publish Hachimi URA v3.27.4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5d85f185b69626ed6f864fa6def36c69a2b9f3be

      - name: Validate release identity
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5d85f185b69626ed6f864fa6def36c69a2b9f3be"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.4"

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build exact v3.27.4 source
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --locked --target aarch64-linux-android --release

      - name: Prepare release files
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=5d85f185b69626ed6f864fa6def36c69a2b9f3be
          cargo_version=3.27.4
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.4
          workflow_run=${GITHUB_RUN_ID}
          EOF

      - name: Create release and server-side tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.27.4 >/dev/null 2>&1; then
            echo "release v3.27.4 already exists" >&2
            exit 1
          fi
          REMOTE_TAG=$(git ls-remote --tags origin refs/tags/v3.27.4 | awk '{print $1}')
          if [ -n "$REMOTE_TAG" ]; then
            gh release create v3.27.4 --verify-tag --title v3.27.4 \
              --notes "IL2CPP live parameter signatures, declaring-type nested-class lookup, and guarded static invocation. Source commit: 5d85f185b69626ed6f864fa6def36c69a2b9f3be" \
              hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so SHA256SUMS BUILD-MANIFEST.txt
          else
            gh release create v3.27.4 --target 5d85f185b69626ed6f864fa6def36c69a2b9f3be --title v3.27.4 \
              --notes "IL2CPP live parameter signatures, declaring-type nested-class lookup, and guarded static invocation. Source commit: 5d85f185b69626ed6f864fa6def36c69a2b9f3be" \
              hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so SHA256SUMS BUILD-MANIFEST.txt
          fi

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v3.27.4 --json assets --jq '.assets[].name' | grep -Fx libhachimi_ura.so
          gh release view v3.27.4 --json assets --jq '.assets[].name' | grep -Fx SHA256SUMS
          gh release view v3.27.4 --json assets --jq '.assets[].name' | grep -Fx BUILD-MANIFEST.txt
