name: Apply MessagePack sniff analyzer

on:
  workflow_dispatch:

concurrency:
  group: messagepack-sniff-integration
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/sniff-messagepack
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 tools/apply_messagepack_sniff.py
      - name: Format and check
        working-directory: hachimi_ura_plugin
        run: |
          cargo fmt
          cargo check
      - name: Commit generated integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hachimi_ura_plugin/src/lib.rs hachimi_ura_plugin/src/protocol_sniff.rs hachimi_ura_plugin/Cargo.toml hachimi_ura_plugin/Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: decode captured MessagePack payloads"
          git pull --rebase origin workbench/sniff-messagepack
          git push origin HEAD:workbench/sniff-messagepack
