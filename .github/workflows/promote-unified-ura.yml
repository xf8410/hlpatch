name: Promote unified URA release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: 3.25.1
      LONG_SOURCE: e3bebba7ad0dada039c1947d8d39b1d1f5b536ce
      UNITY_SOURCE: ed61a66159939daec62a5fef2992768b90704d48
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble unified source from reviewed commits
        run: |
          set -euo pipefail
          git fetch origin "$LONG_SOURCE" "$UNITY_SOURCE"

          # Start from the Android-validated six-feature long-session source.
          git show "$LONG_SOURCE:hachimi_ura_plugin/src/lib.rs" > hachimi_ura_plugin/src/lib.rs
          git show "$LONG_SOURCE:hachimi_ura_plugin/Cargo.toml" > hachimi_ura_plugin/Cargo.toml

          # Reuse the exact observer transformation which produced the tested
          # UnityWebRequest diagnostic build, rather than rebuilding it by hand.
          git show "$UNITY_SOURCE^:.github/workflows/build-ura.yml" > /tmp/unity-observer-workflow.yml
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY[[:space:]]*$/ { exit }
            capture { sub(/^          /, ""); print }
          ' /tmp/unity-observer-workflow.yml > /tmp/apply-unity-observer.py
          test -s /tmp/apply-unity-observer.py
          python3 /tmp/apply-unity-observer.py

          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "3.25.1"
          cargo = Path("hachimi_ura_plugin/Cargo.toml")
          text = cargo.read_text()
          text, count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Cargo version marker mismatch")
          cargo.write_text(text)

          lib = Path("hachimi_ura_plugin/src/lib.rs")
          source = lib.read_text()
          source, count = re.subn(
              r'static SNIFF_ENABLED: AtomicBool = AtomicBool::new\((?:true|false)\);',
              'static SNIFF_ENABLED: AtomicBool = AtomicBool::new(true);',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit("SNIFF_ENABLED marker mismatch")
          lib.write_text(source)
          PY

      - name: Verify unified feature markers and version
        run: |
          set -euo pipefail
          f=hachimi_ura_plugin/src/lib.rs
          grep -Fxq 'version = "3.25.1"' hachimi_ura_plugin/Cargo.toml
          grep -Fq 'SNIFF_ENABLED: AtomicBool = AtomicBool::new(true)' "$f"
          grep -Fq 'SNIFF_RAW_MAX: usize = 50' "$f"
          grep -Fq 'SNIFF_METADATA_MAX: usize = 1000' "$f"
          grep -Fq 'path == "/api/sniff/status"' "$f"
          grep -Fq 'path == "/api/sniff/metadata"' "$f"
          grep -Fq 'SNIFF_RESPONSE_QUEUE' "$f"
          grep -Fq 'UNITY_SEND_ADDR' "$f"
          grep -Fq 'unity_send_hook_handler' "$f"
          grep -Fq 'UnityEngine.UnityWebRequestModule.dll' "$f"
          grep -Fq 'path.starts_with("/api/sniff/unity")' "$f"

      - name: Rust host validation
        working-directory: hachimi_ura_plugin
        run: |
          cargo fmt
          cargo check

      - name: Setup Android target
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android release from assembled source
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --locked --target aarch64-linux-android --release

      - name: Commit the exact built source and create matching tag
        id: source
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hachimi_ura_plugin/Cargo.toml hachimi_ura_plugin/Cargo.lock hachimi_ura_plugin/src/lib.rs
          git commit -m "v${VERSION}: unify long-session sniff and Unity auth observer"
          SOURCE_SHA=$(git rev-parse HEAD)
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
          git tag -f "v${VERSION}" "$SOURCE_SHA"
          git push origin "refs/tags/v${VERSION}" --force

      - name: Verify tag, source version, and binary digest
        id: verify
        run: |
          set -euo pipefail
          SOURCE_SHA='${{ steps.source.outputs.sha }}'
          TAG_SHA=$(git rev-list -n1 "v${VERSION}")
          test "$SOURCE_SHA" = "$TAG_SHA"
          test "$(git show "v${VERSION}:hachimi_ura_plugin/Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -1)" = "$VERSION"
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > hachimi_ura_plugin/target/aarch64-linux-android/release/SHA256SUMS
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Publish reproducible release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BINARY_SHA256: ${{ steps.verify.outputs.sha256 }}
          BINARY_SIZE: ${{ steps.verify.outputs.size }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          SUMS=hachimi_ura_plugin/target/aarch64-linux-android/release/SHA256SUMS
          NOTES=$(cat <<EOF
          Reproducible unified plugin build.

          Included:
          - existing URA training, event, summary and diagnostics features
          - six long-session sniff capabilities from ${LONG_SOURCE}
          - bounded metadata-only UnityWebRequest auth observer from ${UNITY_SOURCE}
          - sniff enabled by default

          Source commit: ${SOURCE_SHA}
          Cargo version: ${VERSION}
          Binary size: ${BINARY_SIZE} bytes
          SHA-256: ${BINARY_SHA256}

          The tag, Cargo version, committed source and uploaded binary are produced by this same workflow run.
          EOF
          )
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES"
          gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          gh release upload "$TAG" "$ASSET" "$SUMS" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-v3.25.1
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/target/aarch64-linux-android/release/SHA256SUMS
          if-no-files-found: error
