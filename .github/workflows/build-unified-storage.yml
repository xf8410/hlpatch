name: Build Unified Storage Endpoint Stage

on:
  push:
    branches:
      - workbench/unified-observation-endpoint-implementation-20260806
    paths:
      - "hachimi_ura_plugin/**"
      - "scripts/apply_unified_endpoint_a_patch.py"
      - "scripts/apply_unified_endpoint_a_compile_fix.py"
      - "scripts/apply_unified_endpoint_b_storage_patch.py"
      - "scripts/apply_unified_endpoint_b_storage_compile_fix.py"
      - ".github/workflows/build-unified-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply unified endpoint patches
        run: |
          set -euo pipefail
          python3 scripts/apply_unified_endpoint_a_patch.py
          python3 scripts/apply_unified_endpoint_a_compile_fix.py
          python3 scripts/apply_unified_endpoint_b_storage_patch.py
          python3 scripts/apply_unified_endpoint_b_storage_compile_fix.py
          FIRST_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          python3 scripts/apply_unified_endpoint_a_patch.py
          python3 scripts/apply_unified_endpoint_a_compile_fix.py
          python3 scripts/apply_unified_endpoint_b_storage_patch.py
          python3 scripts/apply_unified_endpoint_b_storage_compile_fix.py
          SECOND_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST_SHA" = "$SECOND_SHA"
          grep -Fq 'fn storage_status_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'fn storage_sessions_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'fn storage_session_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'fn storage_flush_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'fn storage_recover_endpoint' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'CREATE TABLE IF NOT EXISTS observation_sessions' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'PRAGMA synchronous=FULL' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'current_session.as_ref().map' hachimi_ura_plugin/src/lib.rs

      - name: Audit changed patch scripts
        run: |
          set -euo pipefail
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist' \
            scripts/apply_unified_endpoint_a_patch.py \
            scripts/apply_unified_endpoint_a_compile_fix.py \
            scripts/apply_unified_endpoint_b_storage_patch.py \
            scripts/apply_unified_endpoint_b_storage_compile_fix.py

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build exact checked-out source
        id: cargo_build
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          set -o pipefail
          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee unified_storage_cargo_build.log

      - name: Persist compiler diagnostics
        if: failure() && steps.cargo_build.outcome == 'failure'
        run: |
          set -euo pipefail
          {
            echo '# Unified storage compiler diagnostics'
            echo
            echo '```text'
            cat hachimi_ura_plugin/unified_storage_cargo_build.log
            echo '```'
          } > docs/UNIFIED_STORAGE_BUILD_DIAGNOSTICS.md
          if git diff --quiet -- docs/UNIFIED_STORAGE_BUILD_DIAGNOSTICS.md; then
            echo diagnostics_unchanged=true
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/UNIFIED_STORAGE_BUILD_DIAGNOSTICS.md
          git commit -m 'chore: capture unified storage compiler diagnostics'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Generate build manifest
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          SOURCE_SHA=$(git rev-parse HEAD)
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$SOURCE_SHA
          cargo_version=$VERSION
          binary_size=$SIZE
          binary_sha256=$SHA256
          workflow_run=${GITHUB_RUN_ID}
          build_kind=artifact_only
          endpoint_stage=B-storage
          EOF

      - name: Upload immutable run artifact
        uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-storage-${{ github.sha }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
