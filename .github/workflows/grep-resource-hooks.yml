name: Grep resource_file_dl full implementation

on:
  push:
    branches: [workbench/resource-hooks-and-strip-factor]
  workflow_dispatch:

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/v32817-readall-p1p2

      - name: Find resource_file_dl line numbers
        run: |
          grep -an "resource_file_dl" hachimi_ura_plugin/src/lib.rs

      - name: Dump resource_file_dl handler (±80 lines)
        run: |
          LINENUM=$(grep -an "resource_file_dl" hachimi_ura_plugin/src/lib.rs | head -1 | cut -d: -f1)
          echo "=== First match at line $LINENUM ==="
          START=$((LINENUM - 80))
          END=$((LINENUM + 80))
          if [ $START -lt 1 ]; then START=1; fi
          sed -n "${START},${END}p" hachimi_ura_plugin/src/lib.rs

      - name: Dump all resource_file_dl matches context (±30)
        run: |
          grep -an "resource_file_dl" hachimi_ura_plugin/src/lib.rs | while IFS=: read -r linenum rest; do
            start=$((linenum - 30))
            end=$((linenum + 30))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Find dat path / files/dat usage
        run: |
          echo "=== files/dat ==="
          grep -an "files/dat\|/dat/" hachimi_ura_plugin/src/lib.rs | head -20
          echo "=== find_resource_storage ==="
          grep -an "find_resource_storage\|fn find_resource" hachimi_ura_plugin/src/lib.rs
          echo "=== ureq::get / ureq::post ==="
          grep -an "ureq::get\|ureq::post" hachimi_ura_plugin/src/lib.rs | head -20

      - name: Dump find_resource_storage implementation (±60 lines)
        run: |
          LINENUM=$(grep -an "fn find_resource_storage" hachimi_ura_plugin/src/lib.rs | head -1 | cut -d: -f1)
          if [ -n "$LINENUM" ]; then
            END=$((LINENUM + 80))
            echo "=== find_resource_storage at line $LINENUM ==="
            sed -n "${LINENUM},${END}p" hachimi_ura_plugin/src/lib.rs
          else
            echo "(not found)"
          fi
