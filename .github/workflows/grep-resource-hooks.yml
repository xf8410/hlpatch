name: Grep sqlcipher gate condition

on:
  push:
    branches: [workbench/resource-hooks-and-strip-factor]
  workflow_dispatch:

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/v32817-readall-p1p2

      - name: Find sqlcipher gate line number
        run: |
          echo "=== disabled_v3 ==="
          grep -an "disabled_v3" hachimi_ura_plugin/src/lib.rs
          echo "=== key_hooks_done ==="
          grep -an "key_hooks_done\|key_hooks_skipped" hachimi_ura_plugin/src/lib.rs
          echo "=== meta.prepare ==="
          grep -an "meta\.prepare\|meta\.exec" hachimi_ura_plugin/src/lib.rs

      - name: Dump 100 lines before disabled_v3.24.57
        run: |
          LINENUM=$(grep -an "disabled_v3.24.57" hachimi_ura_plugin/src/lib.rs | head -1 | cut -d: -f1)
          echo "Found at line $LINENUM"
          START=$((LINENUM - 100))
          END=$((LINENUM + 10))
          if [ $START -lt 1 ]; then START=1; fi
          echo "=== Lines $START to $END ==="
          sed -n "${START},${END}p" hachimi_ura_plugin/src/lib.rs

      - name: Dump resource_reads endpoint handler (±30 lines)
        run: |
          echo "=== resource_reads handler ==="
          grep -an "resource_reads" hachimi_ura_plugin/src/lib.rs | while IFS=: read -r linenum rest; do
            start=$((linenum - 30))
            end=$((linenum + 30))
            if [ $start -lt 1 ]; then start=1; fi
            echo "--- around line $linenum: $rest ---"
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "---"
          done

      - name: Dump resource_crypto_symbols handler (±30 lines)
        run: |
          echo "=== resource_crypto_symbols handler ==="
          grep -an "resource_crypto_symbols" hachimi_ura_plugin/src/lib.rs | while IFS=: read -r linenum rest; do
            start=$((linenum - 20))
            end=$((linenum + 50))
            if [ $start -lt 1 ]; then start=1; fi
            echo "--- around line $linenum: $rest ---"
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "---"
          done

      - name: Dump sqlite3_key_hook function (±50 lines)
        run: |
          echo "=== sqlite3_key ==="
          grep -an "sqlite3_key" hachimi_ura_plugin/src/lib.rs | while IFS=: read -r linenum rest; do
            start=$((linenum - 10))
            end=$((linenum + 50))
            if [ $start -lt 1 ]; then start=1; fi
            echo "--- around line $linenum: $rest ---"
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "---"
          done

      - name: Dump META_KEY_HEX usage (±30 lines)
        run: |
          echo "=== META_KEY_HEX ==="
          grep -an "META_KEY_HEX" hachimi_ura_plugin/src/lib.rs | while IFS=: read -r linenum rest; do
            start=$((linenum - 20))
            end=$((linenum + 20))
            if [ $start -lt 1 ]; then start=1; fi
            echo "--- around line $linenum: $rest ---"
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "---"
          done

      - name: Dump DB_KEY_LOG usage (±30 lines)
        run: |
          echo "=== DB_KEY_LOG ==="
          grep -an "DB_KEY_LOG" hachimi_ura_plugin/src/lib.rs | while IFS=: read -r linenum rest; do
            start=$((linenum - 20))
            end=$((linenum + 20))
            if [ $start -lt 1 ]; then start=1; fi
            echo "--- around line $linenum: $rest ---"
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "---"
          done

      - name: Dump on_game_initialized (±50 lines)
        run: |
          echo "=== on_game_initialized ==="
          grep -an "on_game_initialized\|game_initialized" hachimi_ura_plugin/src/lib.rs | head -10 | while IFS=: read -r linenum rest; do
            start=$((linenum - 20))
            end=$((linenum + 50))
            if [ $start -lt 1 ]; then start=1; fi
            echo "--- around line $linenum: $rest ---"
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "---"
          done
