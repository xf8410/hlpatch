name: Grep CDN URL construction in lib.rs

on:
  push:
    branches: [workbench/resource-hooks-and-strip-factor]
  workflow_dispatch:

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/v32817-readall-p1p2

      - name: Grep CDN / akamaized / resource_file_dl
        run: |
          echo "=== akamaized ==="
          grep -an "akamaized" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== cloudfront ==="
          grep -an "cloudfront" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== cdn ==="
          grep -an -i "cdn" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== resource_file_dl ==="
          grep -an "resource_file_dl" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== resource_meta_dl ==="
          grep -an "resource_meta_dl" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== https:// ==="
          grep -an "https://" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== http:// ==="
          grep -an "http://" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== download_url ==="
          grep -an "download_url\|download_base\|base_url\|cdn_url\|cdn_base" hachimi_ura_plugin/src/lib.rs || echo "(none)"

      - name: Dump resource_file_dl context (±40 lines)
        run: |
          echo "=== resource_file_dl context ==="
          grep -an "resource_file_dl" hachimi_ura_plugin/src/lib.rs | head -5 | while IFS=: read -r linenum rest; do
            start=$((linenum - 40))
            end=$((linenum + 40))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Dump resource_meta_dl context (±40 lines)
        run: |
          echo "=== resource_meta_dl context ==="
          grep -an "resource_meta_dl" hachimi_ura_plugin/src/lib.rs | head -5 | while IFS=: read -r linenum rest; do
            start=$((linenum - 40))
            end=$((linenum + 40))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Dump any https:// context (±20 lines)
        run: |
          echo "=== https:// context ==="
          grep -an "https://" hachimi_ura_plugin/src/lib.rs | head -10 | while IFS=: read -r linenum rest; do
            start=$((linenum - 10))
            end=$((linenum + 20))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done
