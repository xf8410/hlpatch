name: Grep lib.rs with -a flag (force text mode)

on:
  push:
    branches: [workbench/resource-hooks-and-strip-factor]
  workflow_dispatch:

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/v32817-readall-p1p2

      - name: Grep sqlcipher / meta key / resource endpoints (text mode)
        run: |
          echo "=== sqlcipher ==="
          grep -an -i "sqlcipher" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== 3.24.57 ==="
          grep -an "3\.24\.57" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== meta_key ==="
          grep -an "meta_key" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== sqlite3_key ==="
          grep -an "sqlite3_key" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== resource_meta ==="
          grep -an "resource_meta" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== resource_crypto ==="
          grep -an "resource_crypto" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== resource_reads ==="
          grep -an "resource_reads" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== resource_db_keys ==="
          grep -an "resource_db_keys" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== meta.sqlcipher ==="
          grep -an "meta\.sqlcipher" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== meta_sqlcipher ==="
          grep -an "meta_sqlcipher" hachimi_ura_plugin/src/lib.rs || echo "(none)"

      - name: Grep boot install / hook install
        run: |
          echo "=== GAME_INITIALIZED ==="
          grep -an "GAME_INITIALIZED" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== install_api_sniff ==="
          grep -an "install_api_sniff" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== install_sniff ==="
          grep -an "install_sniff" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== install_all ==="
          grep -an "install_all" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== push_probe ==="
          grep -an "push_probe" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== boot install ==="
          grep -an "boot.install\|boot_install" hachimi_ura_plugin/src/lib.rs || echo "(none)"

      - name: Grep factor index references
        run: |
          echo "=== factor ==="
          grep -an "factor" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== FactorBadge ==="
          grep -an "FactorBadge\|factor_badge\|factor_index" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== select_update ==="
          grep -an "select_update\|select_item\|set_text_hook" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== mod factor ==="
          grep -an "mod factor\|include.*factor" hachimi_ura_plugin/src/lib.rs || echo "(none)"

      - name: Dump sqlcipher context (±30 lines)
        run: |
          echo "=== sqlcipher context ==="
          grep -an -i "sqlcipher" hachimi_ura_plugin/src/lib.rs | head -10 | while IFS=: read -r linenum rest; do
            start=$((linenum - 30))
            end=$((linenum + 30))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Dump resource_meta_key context (±30 lines)
        run: |
          echo "=== resource_meta_key context ==="
          grep -an "resource_meta_key" hachimi_ura_plugin/src/lib.rs | head -10 | while IFS=: read -r linenum rest; do
            start=$((linenum - 30))
            end=$((linenum + 30))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Dump boot install context (±30 lines)
        run: |
          echo "=== install_api_sniff context ==="
          grep -an "install_api_sniff" hachimi_ura_plugin/src/lib.rs | head -5 | while IFS=: read -r linenum rest; do
            start=$((linenum - 30))
            end=$((linenum + 30))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Dump meta.sqlcipher context (±30 lines)
        run: |
          echo "=== meta.sqlcipher context ==="
          grep -an "meta\.sqlcipher" hachimi_ura_plugin/src/lib.rs | head -10 | while IFS=: read -r linenum rest; do
            start=$((linenum - 30))
            end=$((linenum + 30))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Dump hookdiag context (±30 lines)
        run: |
          echo "=== hookdiag context ==="
          grep -an "hookdiag" hachimi_ura_plugin/src/lib.rs | head -5 | while IFS=: read -r linenum rest; do
            start=$((linenum - 30))
            end=$((linenum + 30))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Dump push_loop context (±30 lines)
        run: |
          echo "=== push_loop context ==="
          grep -an "fn push_loop\|push_probe_begin" hachimi_ura_plugin/src/lib.rs | head -5 | while IFS=: read -r linenum rest; do
            start=$((linenum - 10))
            end=$((linenum + 50))
            if [ $start -lt 1 ]; then start=1; fi
            echo "=== around line $linenum: $rest ==="
            sed -n "${start},${end}p" hachimi_ura_plugin/src/lib.rs
            echo "=== end ==="
          done

      - name: Check for factor_index_badge.rs inclusion in build
        run: |
          echo "=== Cargo.toml ==="
          cat hachimi_ura_plugin/Cargo.toml
          echo "=== mod declarations in lib.rs ==="
          grep -an "^mod \|^pub mod \|^use.*factor" hachimi_ura_plugin/src/lib.rs || echo "(none)"
          echo "=== include! in lib.rs ==="
          grep -an "include!" hachimi_ura_plugin/src/lib.rs || echo "(none)"
