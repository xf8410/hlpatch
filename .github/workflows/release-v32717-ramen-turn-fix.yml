name: Release v3.27.17 Ramen Turn Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and validate release source
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('hachimi_ura_plugin/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text = text.replace('version = "3.27.11"', 'version = "3.27.17"', 1)
          cargo.write_text(text, encoding='utf-8')
          lock = Path('hachimi_ura_plugin/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          text = text.replace('name = "hachimi_ura"\nversion = "3.27.11"', 'name = "hachimi_ura"\nversion = "3.27.17"', 1)
          lock.write_text(text, encoding='utf-8')
          PY
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.17"
          grep -Fq 'version = "3.27.17"' hachimi_ura_plugin/Cargo.lock
          grep -Fq 'verified_ramen_upstream_semantics' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Ramen turn mapping follows upstream umaai-rs semantics' hachimi_ura_plugin/src/lib.rs

      - name: Add non-mutating HookRegistry address validation
        run: |
          set -euo pipefail
          apply_validation() {
            python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path('hachimi_ura_plugin/src/lib.rs')
          text = source.read_text(encoding='utf-8')
          marker = '// ===== Next-generation HookRegistry address validation ====='
          if marker in text:
              print('hook_registry_address_validation=already_applied')
              raise SystemExit(0)

          boot = re.search(r'((?:static|const)\s+BOOT_SAFE_EXACT\b[^=]*=\s*&\[)', text, re.M)
          if boot is None:
              raise RuntimeError('BOOT_SAFE_EXACT declaration missing')
          end = text.find('];', boot.end())
          if end < 0:
              raise RuntimeError('BOOT_SAFE_EXACT terminator missing')
          if '"/hooks/validation"' not in text[boot.start():end]:
              text = text[:boot.end()] + '\n    "/hooks/validation",' + text[boot.end():]

          anchor = 'fn foundation_parameter_types_json(values: &[&str]) -> String {\n'
          if text.count(anchor) != 1:
              raise RuntimeError(f'validation code anchor count={text.count(anchor)}')
          rust = r'''// ===== Next-generation HookRegistry address validation =====
          struct FoundationAddressValidation {
              map_start: usize,
              map_end: usize,
              permissions: String,
              module_path: String,
              current_prologue: Vec<u8>,
          }

          fn foundation_validate_address(address: usize) -> Result<FoundationAddressValidation, String> {
              if address == 0 {
                  return Err("target_address_not_observed".to_string());
              }
              if address % 4 != 0 {
                  return Err("target_address_not_arm64_aligned".to_string());
              }
              let maps = std::fs::read_to_string("/proc/self/maps")
                  .map_err(|error| format!("read_proc_maps:{}", error))?;
              for line in maps.lines() {
                  let mut columns = line.split_whitespace();
                  let range = match columns.next() { Some(value) => value, None => continue };
                  let permissions = match columns.next() { Some(value) => value, None => continue };
                  let mut bounds = range.split('-');
                  let start = match bounds.next().and_then(|value| usize::from_str_radix(value, 16).ok()) {
                      Some(value) => value, None => continue,
                  };
                  let end = match bounds.next().and_then(|value| usize::from_str_radix(value, 16).ok()) {
                      Some(value) => value, None => continue,
                  };
                  if address < start || address >= end { continue; }
                  if !permissions.contains('r') { return Err("target_mapping_not_readable".to_string()); }
                  if !permissions.contains('x') { return Err("target_mapping_not_executable".to_string()); }
                  if end.saturating_sub(address) < 16 || !is_readable_range(address, 16) {
                      return Err("target_prologue_not_readable".to_string());
                  }
                  let module_path = line.split_whitespace().nth(5).unwrap_or("").to_string();
                  let current_prologue = unsafe {
                      std::slice::from_raw_parts(address as *const u8, 16).to_vec()
                  };
                  return Ok(FoundationAddressValidation {
                      map_start: start, map_end: end, permissions: permissions.to_string(),
                      module_path, current_prologue,
                  });
              }
              Err("target_address_not_mapped".to_string())
          }

          unsafe fn foundation_hook_validation_endpoint() -> String {
              let records = foundation_hook_records();
              let mut valid_count = 0usize;
              let items = records.iter().map(|record| {
                  match foundation_validate_address(record.target_address) {
                      Ok(validation) => {
                          valid_count += 1;
                          format!(
                              r#"{{"hook_id":"{}","address_validation":"valid","signature_validation":"pending_method_info","target_address":"0x{:x}","map_start":"0x{:x}","map_end":"0x{:x}","mapping_permissions":"{}","module_path":"{}","current_prologue_bytes":"{}","external_hook_present":null,"ownership_decision":"not_evaluated","commit_allowed":false,"raw_error":null}}"#,
                              json_escape(record.hook_id), record.target_address, validation.map_start,
                              validation.map_end, json_escape(&validation.permissions),
                              json_escape(&validation.module_path), hex_encode(&validation.current_prologue)
                          )
                      }
                      Err(error) => format!(
                          r#"{{"hook_id":"{}","address_validation":"failed","signature_validation":"pending_method_info","target_address":{},"map_start":null,"map_end":null,"mapping_permissions":null,"module_path":null,"current_prologue_bytes":null,"external_hook_present":null,"ownership_decision":"not_evaluated","commit_allowed":false,"raw_error":"{}"}}"#,
                          json_escape(record.hook_id),
                          if record.target_address == 0 { "null".to_string() } else { format!("\"0x{:x}\"", record.target_address) },
                          json_escape(&error)
                      ),
                  }
              }).collect::<Vec<_>>().join(",");
              format!(
                  r#"{{"ok":true,"schema_version":1,"mode":"non_mutating_validation","resolve_validate_commit_active":false,"valid_address_count":{},"total_count":{},"hooks":[{}]}}"#,
                  valid_count, records.len(), items
              )
          }

          '''
          text = text.replace(anchor, rust + anchor, 1)

          route = '    } else if path == "/hooks/diagnostics" {\n'
          if text.count(route) != 1:
              raise RuntimeError(f'validation route anchor count={text.count(route)}')
          text = text.replace(route, '''    } else if path == "/hooks/validation" {
              unsafe { foundation_hook_validation_endpoint() }
          ''' + route, 1)
          source.write_text(text, encoding='utf-8')
          print('hook_registry_address_validation=applied')
          PY
          }
          apply_validation
          FIRST_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          apply_validation
          SECOND_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST_SHA" = "$SECOND_SHA"

      - name: Audit changed implementation path
        run: |
          set -euo pipefail
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist' \
            scripts/run_generated_succession_l_cumulative.py

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          HLPATCH_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -o pipefail
          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee release-v32717-cargo.log

      - name: Prepare release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          cargo_version=3.27.17
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.17
          workflow_run=${GITHUB_RUN_ID}
          feature=ramen_turn_fix_ai_evaluation
          endpoints=/summary
          runtime_validation=pending_device_execution
          EOF

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          if gh release view v3.27.17 > /dev/null 2>&1; then
            echo 'v3.27.17 already exists; refusing to overwrite' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v3.27.17 "$GITHUB_SHA" -m "Release v3.27.17"
          git push origin refs/tags/v3.27.17
          gh release create v3.27.17 --verify-tag --title v3.27.17 \
            --notes "Fix ramen cup (sid=14) turn mapping and AI evaluation.

          - Ramen turn: use raw_total_turn_num with upstream umaai-rs year boundaries (24/48)
          - AI evaluation: enable evaluate_ai for scenario 14 (was hardcoded unavailable)
          - JSON metadata: raw_field_mapping verified as verified_ramen_upstream_semantics
          - temporal_turn_verified set to true for ramen cup turns" \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt

      - name: Verify release identity and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          RELEASE_JSON=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.17)
          test "$(git rev-list -n1 v3.27.17)" = "$GITHUB_SHA"
          test "$(printf '%s' "$RELEASE_JSON" | jq '[.assets[] | select(.name == "libhachimi_ura.so")] | length')" = "1"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .size')" = "$SIZE"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .digest')" = "sha256:$SHA256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libhachimi_ura-v3.27.17-run-${{ github.run_id }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/release-v32717-cargo.log
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: warn
