name: Repair legacy v3.25.1 release consistency

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.25.1
          fetch-depth: 0

      - name: Verify exact legacy tag
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n1 v3.25.1)"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.25.1"

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Rebuild exact tagged source
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --locked --target aarch64-linux-android --release

      - name: Generate matching metadata
        id: meta
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          SOURCE_SHA=$(git rev-parse HEAD)
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$SOURCE_SHA
          cargo_version=3.25.1
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.25.1
          repair_workflow_run=${GITHUB_RUN_ID}
          EOF
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Repair release assets and notes once
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SIZE: ${{ steps.meta.outputs.size }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          gh release upload v3.25.1 "$ASSET" SHA256SUMS BUILD-MANIFEST.txt --clobber
          NOTES=$(cat <<EOF
          Legacy release consistency repaired from the exact v3.25.1 tag.

          Source commit: $SOURCE_SHA
          Cargo version: 3.25.1
          Binary size: $SIZE bytes
          SHA-256: $SHA256
          Repair workflow run: $GITHUB_RUN_ID

          The SO, SHA256SUMS and BUILD-MANIFEST.txt now describe the same tagged source and binary. Future releases are immutable and cannot overwrite an existing tag.
          EOF
          )
          gh release edit v3.25.1 --title v3.25.1 --notes "$NOTES"

      - name: Verify repaired release API state
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          API_DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v3.25.1" \
            --jq '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$API_DIGEST" = "sha256:$SHA256"
          grep -Fxq "$SHA256  libhachimi_ura.so" SHA256SUMS
          test "$SOURCE_SHA" = "$(git rev-list -n1 v3.25.1)"
