name: Extract storage read_range HTTP context

on:
  push:
    branches:
      - workbench/next-generation-so-foundation-20260808
    paths:
      - ".github/workflows/extract-storage-read-range-context.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate exact cumulative v3.27.11 source
        run: python3 scripts/run_generated_succession_l_cumulative.py

      - name: Extract bounded HTTP and storage anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          source = Path("hachimi_ura_plugin/src/lib.rs")
          lines = source.read_text(encoding="utf-8").splitlines()
          needles = (
              "HTTP/1.1", "Content-Length", "write_all", "TcpStream",
              "storage_files_endpoint", "storage_download", "observation_files",
              "let body = if path", "full_uri", "parse_request_uri",
          )
          ranges = []
          for index, line in enumerate(lines):
              if any(needle in line for needle in needles):
                  start = max(0, index - 16)
                  end = min(len(lines), index + 25)
                  if not any(start >= old_start and end <= old_end for old_start, old_end in ranges):
                      ranges.append((start, end))
          merged = []
          for start, end in sorted(ranges):
              if merged and start <= merged[-1][1]:
                  merged[-1] = (merged[-1][0], max(merged[-1][1], end))
              else:
                  merged.append((start, end))
          output = [
              "# Storage read_range exact HTTP context", "",
              f"source_commit: `{subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()}`", "",
          ]
          for start, end in merged:
              output += [f"## lines {start + 1}-{end}", "", "```rust"]
              output += [f"{i + 1}: {lines[i]}" for i in range(start, end)]
              output += ["```", ""]
          Path("docs/STORAGE_READ_RANGE_HTTP_CONTEXT.md").write_text("\n".join(output), encoding="utf-8")
          print(f"matched_ranges={len(merged)}")
          PY

      - name: Commit bounded context
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/STORAGE_READ_RANGE_HTTP_CONTEXT.md
          if git diff --cached --quiet; then
            echo context_unchanged=true
          else
            git commit -m "chore: capture storage read_range HTTP context"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
