name: Run sniff patcher with log
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/workflows/run-sniff-patcher-with-log.yml]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/sniff-v2
          fetch-depth: 0
      - name: Execute current patcher and preserve diagnostics
        run: |
          set +e
          git fetch origin main
          git show origin/main:.github/workflows/apply-sniff-v2-once.yml > /tmp/workflow.yml
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/workflow.yml').read_text()
          start=s.index("cat > /tmp/patch.py <<'PY'")+len("cat > /tmp/patch.py <<'PY'\n")
          end=s.index("\n          PY",start)
          lines=s[start:end].splitlines()
          Path('/tmp/patch.py').write_text('\n'.join(x[10:] if x.startswith('          ') else x for x in lines)+'\n')
          PY
          python3 /tmp/patch.py > /tmp/patch.log 2>&1
          patch_status=$?
          if [ $patch_status -eq 0 ]; then
            (cd hachimi_ura_plugin && cargo fmt) >> /tmp/patch.log 2>&1
            fmt_status=$?
            (cd hachimi_ura_plugin && cargo check) >> /tmp/patch.log 2>&1
            check_status=$?
          else
            fmt_status=99
            check_status=99
          fi
          {
            echo '# Sniff patch execution log'
            echo
            echo "patch_status=$patch_status fmt_status=$fmt_status check_status=$check_status"
            echo '```text'
            cat /tmp/patch.log
            echo '```'
          } > docs/sniff-v2-execution.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "debug: capture sniff patch execution status" || true
          git push origin HEAD:workbench/sniff-v2
