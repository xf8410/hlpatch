name: Release Hachimi URA Plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing immutable version tag, for example v3.25.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "tag must look like v3.25.2" >&2
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag and source version
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          test "$TAG" = "v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to overwrite it" >&2
            exit 1
          fi

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build tagged source
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --locked --target aarch64-linux-android --release

      - name: Generate release metadata
        id: meta
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          SOURCE_SHA=$(git rev-parse HEAD)
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$SOURCE_SHA
          cargo_version=$VERSION
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=${{ inputs.tag }}
          workflow_run=${GITHUB_RUN_ID}
          EOF
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SIZE: ${{ steps.meta.outputs.size }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          NOTES=$(cat <<EOF
          Immutable tagged URA plugin release.

          Source commit: $SOURCE_SHA
          Cargo version: $VERSION
          Binary size: $SIZE bytes
          SHA-256: $SHA256
          Workflow run: $GITHUB_RUN_ID

          Verify after downloading with SHA256SUMS. Assets for an existing tag are never overwritten.
          EOF
          )
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$NOTES" \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt

      - name: Verify published asset digest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          API_DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name == "libhachimi_ura.so") | .digest')
          test "$API_DIGEST" = "sha256:$SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-${{ inputs.tag }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
