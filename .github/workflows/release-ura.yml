name: Release Hachimi URA Plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create from main"
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create immutable version tag from current main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$TAG" = "v3.25.2"
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          test "$TAG" = "v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; refusing to move it" >&2
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$SHA"
          echo "Created $TAG at $SHA"

      - name: Dispatch canonical immutable release workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh workflow run release-ura.yml --ref main -f tag="$TAG"
