name: Cleanup temporary patch workflows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/inspect-sniff-source.yml \
                    .github/workflows/apply-sniff-long-capture.yml \
                    .github/workflows/cleanup-temporary-workflows.yml
          git commit -m 'chore: remove temporary sniff patch workflows'
          git push origin HEAD:main
