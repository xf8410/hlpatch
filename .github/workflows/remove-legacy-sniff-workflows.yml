name: Remove obsolete sniff migration machinery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Delete obsolete workflows and patcher
        run: |
          rm -f \
            .github/workflows/apply-sniff-v2-fixed.yml \
            .github/workflows/apply-sniff-v2-once.yml \
            .github/workflows/capture-failed-sniff-run.yml \
            .github/workflows/execute-sniff-v2-script.yml \
            .github/workflows/run-sniff-patcher-with-log.yml \
            tools/apply_sniff_v2.py \
            .github/workflows/remove-legacy-sniff-workflows.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ci: remove obsolete sniff v2 migration machinery"
          git push origin HEAD:main
