name: Fix storage read_range generator quoting

on:
  push:
    branches:
      - workbench/next-generation-so-foundation-20260808
    paths:
      - ".github/workflows/fix-storage-read-range-generator-quoting.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix the two conflicting Python string delimiters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/implement-storage-read-range.yml')
          text = path.read_text(encoding='utf-8')
          old_start = "          patch.write_text(r'''from pathlib import Path\n"
          new_start = '          patch.write_text(r"""from pathlib import Path\n'
          old_end = "          ''', encoding=\"utf-8\")\n\n          cumulative = Path(\"scripts/run_generated_succession_l_cumulative.py\")"
          new_end = '          """, encoding="utf-8")\n\n          cumulative = Path("scripts/run_generated_succession_l_cumulative.py")'
          if text.count(old_start) != 1 or text.count(old_end) != 1:
              raise RuntimeError(f'quoting anchors start={text.count(old_start)} end={text.count(old_end)}')
          text = text.replace(old_start, new_start, 1).replace(old_end, new_end, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          yaml.safe_load(Path('.github/workflows/implement-storage-read-range.yml').read_text(encoding='utf-8'))
          PY

      - name: Commit the single diagnosed fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/implement-storage-read-range.yml
          git commit -m "fix: repair A1 patch generator string delimiters"
          git push origin HEAD:${GITHUB_REF_NAME}
