name: Build Generated Succession Runtime L
on:
  push:
    branches:
      - workbench/generated-succession-runtime-l-20260807
      - workbench/ramen-hachimi-text-observer-20260807
      - workbench/succession-white-factor-audit-20260827
    paths:
      - scripts/apply_generated_succession_runtime_l.py
      - scripts/apply_generated_succession_runtime_l_support_fix.py
      - scripts/apply_ramen_global_durable_observation.py
      - scripts/apply_hachimi_textcommon_observer.py
      - scripts/apply_succession_white_factor_audit.py
      - scripts/apply_succession_audit_bonus_delta.py
      - scripts/run_generated_succession_l_cumulative.py
      - .github/workflows/build-generated-succession-runtime-l.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cumulative patches and succession audit twice
        id: apply
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py 2>&1 | tee l_apply.log
          python3 scripts/apply_succession_white_factor_audit.py 2>&1 | tee -a l_apply.log
          python3 scripts/apply_succession_audit_bonus_delta.py 2>&1 | tee -a l_apply.log
          python3 scripts/apply_succession_white_factor_audit.py 2>&1 | tee -a l_apply.log
          python3 scripts/apply_succession_audit_bonus_delta.py 2>&1 | tee -a l_apply.log
          grep -Fq 'Succession white-factor static lookup and runtime audit Q-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'Succession per-factor bonus delta R-stage' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'path == "/inherit/factor_static"' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'path == "/inherit/factors_static"' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'path == "/inherit/audit/events"' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'GetBonusValueByType_before_after_original_ApplyFactor' hachimi_ura_plugin/src/lib.rs
          python3 - <<'PY'
          from pathlib import Path
          import re
          cargo=Path('hachimi_ura_plugin/Cargo.toml')
          text=cargo.read_text(encoding='utf-8')
          text=re.sub(r'(?m)^version = "[^"]+"$', 'version = "3.27.22"', text, count=1)
          cargo.write_text(text,encoding='utf-8')
          lock=Path('hachimi_ura_plugin/Cargo.lock')
          text=lock.read_text(encoding='utf-8')
          text=re.sub(r'(name = "hachimi_ura"\nversion = ")[^"]+', r'\g<1>3.27.22', text, count=1)
          lock.write_text(text,encoding='utf-8')
          PY
      - name: Setup Rust
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true
      - name: Build Android arm64 release
        id: cargo
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          HLPATCH_SOURCE_COMMIT: ${{ github.sha }}
        run: set -o pipefail; cargo build --target aarch64-linux-android --release 2>&1 | tee succession-audit-cargo.log
      - name: Manifest
        if: success()
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          sha256sum "$ASSET" > SHA256SUMS
          printf 'source_commit=%s\nversion=3.27.22\nbuild_kind=artifact_only\nfeature=succession_white_factor_audit\n' "${GITHUB_SHA}" > BUILD-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libhachimi_ura-succession-white-factor-audit-${{ github.run_id }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
            l_apply.log
            hachimi_ura_plugin/succession-audit-cargo.log
          if-no-files-found: warn
