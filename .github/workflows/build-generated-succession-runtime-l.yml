name: Build Generated Succession Runtime L
on:
  push:
    branches: [workbench/generated-succession-runtime-l-20260807]
    paths:
      - scripts/apply_generated_succession_runtime_l.py
      - scripts/apply_generated_succession_runtime_l_support_fix.py
      - .github/workflows/build-generated-succession-runtime-l.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cumulative patches and L twice
        run: |
          set -o pipefail
          {
            set -euo pipefail
            for pass in 1 2; do
              python3 scripts/fix_unified_endpoint_f_patch_anchors.py
              python3 scripts/apply_unified_endpoint_a_patch.py
              python3 scripts/apply_unified_endpoint_a_compile_fix.py
              python3 scripts/apply_unified_endpoint_b_storage_patch.py
              python3 scripts/apply_unified_endpoint_b_storage_compile_fix.py
              python3 scripts/apply_unified_endpoint_c_inherit_pair_patch.py
              python3 scripts/apply_unified_endpoint_d_selected_parent_patch.py
              python3 scripts/apply_unified_endpoint_e_runtime_correction.py
              python3 scripts/apply_unified_endpoint_f_pre_release_fix.py
              python3 scripts/apply_unified_endpoint_g_release_gate_fix.py
              python3 scripts/apply_unified_endpoint_h_response_headers.py
              python3 scripts/apply_unified_endpoint_i_parent_multisource.py
              python3 scripts/apply_unified_endpoint_j_parent_runtime_semantics.py
              python3 scripts/apply_unified_endpoint_k_complete.py
              python3 scripts/apply_generated_succession_runtime_l.py
              python3 scripts/apply_generated_succession_runtime_l_support_fix.py
              sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1 > source-$pass.sha
            done
            cmp source-1.sha source-2.sha
            test "$(grep -c 'path == \"/generate_succession/runtime_full\"' hachimi_ura_plugin/src/lib.rs)" = 1
            ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist|truncate|preview' scripts/apply_generated_succession_runtime_l.py scripts/apply_generated_succession_runtime_l_support_fix.py
            grep -n -C 3 -E '65536|65_536|64 \* 1024|64\*1024' hachimi_ura_plugin/src/lib.rs > PROTOCOL_65536_AUDIT.txt || true
          } 2>&1 | tee l_apply.log
      - name: Setup Rust
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true
      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: set -o pipefail; cargo build --target aarch64-linux-android --release 2>&1 | tee l_cargo.log
      - name: Manifest
        run: |
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          sha256sum "$ASSET" > SHA256SUMS
          printf 'source_commit=%s\nbuild_kind=artifact_only\nendpoint=/generate_succession/runtime_full\n' "$(git rev-parse HEAD)" > BUILD-MANIFEST.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libhachimi_ura-generated-succession-l-${{ github.sha }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
            PROTOCOL_65536_AUDIT.txt
            l_apply.log
            hachimi_ura_plugin/l_cargo.log
          if-no-files-found: warn
