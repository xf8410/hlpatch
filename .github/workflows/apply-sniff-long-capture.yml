name: Apply sniff long capture upgrade
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/sniff-long-capture
      - name: Apply targeted source upgrade
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hachimi_ura_plugin/src/lib.rs')
          s=p.read_text()
          def once(old,new):
              global s
              n=s.count(old)
              if n != 1: raise SystemExit(f'expected one match, got {n}: {old[:100]!r}')
              s=s.replace(old,new,1)
          once('''// SniffEntry: (id, url, headers_json, body)
          static mut SNIFF_REQUESTS: Vec<(u64, String, String, Vec<u8>)> = Vec::new();
          static mut SNIFF_RESPONSES: Vec<(u64, Vec<u8>)> = Vec::new();
          static SNIFF_MAX: usize = 20;
          static SNIFF_REQ_ID: AtomicU64 = AtomicU64::new(0);
          static mut PENDING_URL: String = String::new();''','''// Raw payloads stay in a deliberately small in-process ring. Metadata has a
          // separate, much larger ring so long sessions do not retain large bodies.
          static mut SNIFF_REQUESTS: Vec<(u64, String, String, Vec<u8>)> = Vec::new();
          static mut SNIFF_RESPONSES: Vec<(u64, Vec<u8>)> = Vec::new();
          const SNIFF_RAW_MAX: usize = 50;
          const SNIFF_METADATA_MAX: usize = 1000;
          static SNIFF_REQ_ID: AtomicU64 = AtomicU64::new(0);
          static SNIFF_METADATA_ID: AtomicU64 = AtomicU64::new(1);
          #[derive(Clone)]
          struct SniffMetadata {
              id: u64,
              request_id: u64,
              timestamp_ms: u64,
              direction: &'static str,
              path: String,
              size: usize,
          }
          static mut SNIFF_METADATA: Vec<SniffMetadata> = Vec::new();
          // FIFO is safer than pairing every response with only the latest request.
          // This remains temporal pairing until a stable request-object hook is available.
          static mut PENDING_RESPONSE_IDS: Vec<u64> = Vec::new();
          static mut PENDING_URL: String = String::new();''')
          once('''static mut PENDING_COMPRESSED: usize = 0;
          // ★ Mutex to prevent concurrent read_summary_inner calls from HTTP + push threads''','''static mut PENDING_COMPRESSED: usize = 0;
          fn sniff_path(url: &str) -> String {
              let no_query = url.split('?').next().unwrap_or(url);
              if let Some(scheme) = no_query.find("://") {
                  let rest = &no_query[scheme + 3..];
                  return rest.find('/').map(|i| rest[i..].to_string()).unwrap_or_else(|| "/".to_string());
              }
              no_query.to_string()
          }
          unsafe fn push_sniff_metadata(request_id: u64, direction: &'static str, url: &str, size: usize) {
              let id = SNIFF_METADATA_ID.fetch_add(1, Ordering::Relaxed);
              SNIFF_METADATA.push(SniffMetadata {
                  id, request_id,
                  timestamp_ms: sniff_timestamp().saturating_mul(1000),
                  direction, path: sniff_path(url), size,
              });
              if SNIFF_METADATA.len() > SNIFF_METADATA_MAX { SNIFF_METADATA.remove(0); }
          }
          // ★ Mutex to prevent concurrent read_summary_inner calls from HTTP + push threads''')
          once('''            "/api/sniff", "/api/sniff/diag", "/api/sniff/toggle", "/api/sniff/clear",''','''            "/api/sniff", "/api/sniff/metadata", "/api/sniff/status", "/api/sniff/diag", "/api/sniff/toggle", "/api/sniff/clear",''')
          once('''    } else if path == "/api/sniff/toggle" {
              // ★ v3.24.40: lazy retry for fallback-mode installs.
              unsafe {
                  install_api_sniff_hooks();
              }
              let new_val = !SNIFF_ENABLED.load(Ordering::Relaxed);
              SNIFF_ENABLED.store(new_val, Ordering::Relaxed);''','''    } else if path == "/api/sniff/status" {
              let _lock = SNIFF_MUTEX.lock();
              unsafe {
                  let last_id = SNIFF_METADATA.last().map(|m| m.id).unwrap_or(0);
                  let request_count = SNIFF_METADATA.iter().filter(|m| m.direction == "request").count();
                  let response_count = SNIFF_METADATA.iter().filter(|m| m.direction == "response").count();
                  format!(r#"{{"enabled":{},"raw_request_count":{},"raw_response_count":{},"metadata_count":{},"request_count":{},"response_count":{},"last_id":{},"raw_limit":{},"metadata_limit":{}}}"#,
                      SNIFF_ENABLED.load(Ordering::Relaxed), SNIFF_REQUESTS.len(), SNIFF_RESPONSES.len(), SNIFF_METADATA.len(),
                      request_count, response_count, last_id, SNIFF_RAW_MAX, SNIFF_METADATA_MAX)
              }
          } else if path == "/api/sniff/metadata" {
              let after_id: u64 = parse_query(&full_uri, "after_id").parse().unwrap_or(0);
              let _lock = SNIFF_MUTEX.lock();
              unsafe {
                  let entries: Vec<String> = SNIFF_METADATA.iter().filter(|m| m.id > after_id).map(|m| format!(
                      r#"{{"id":{},"request_id":{},"timestamp_ms":{},"direction":"{}","path":"{}","size":{}}}"#,
                      m.id, m.request_id, m.timestamp_ms, m.direction, json_escape(&m.path), m.size)).collect();
                  let last_id = SNIFF_METADATA.last().map(|m| m.id).unwrap_or(after_id);
                  format!(r#"{{"enabled":{},"after_id":{},"last_id":{},"count":{},"entries":[{}]}}"#,
                      SNIFF_ENABLED.load(Ordering::Relaxed), after_id, last_id, entries.len(), entries.join(","))
              }
          } else if path == "/api/sniff/toggle" {
              unsafe { install_api_sniff_hooks(); }
              let body_start = req.find("\\r\\n\\r\\n").map(|i| i + 4).unwrap_or(req.len());
              let requested = req[body_start..].trim();
              let new_val = match requested {
                  "1" | "true" => true,
                  "0" | "false" => false,
                  _ => !SNIFF_ENABLED.load(Ordering::Relaxed),
              };
              SNIFF_ENABLED.store(new_val, Ordering::Relaxed);''')
          once('''        unsafe {
                  SNIFF_REQUESTS.clear();
                  SNIFF_RESPONSES.clear();
              }
              r#"{"ok":true}"#.to_string()''','''        unsafe {
                  SNIFF_REQUESTS.clear();
                  SNIFF_RESPONSES.clear();
                  SNIFF_METADATA.clear();
                  PENDING_RESPONSE_IDS.clear();
                  PENDING_REQ_BODY = None;
              }
              r#"{"ok":true,"ids_remain_monotonic":true}"#.to_string()''')
          once('''                    let rid = PENDING_REQ_ID;
                      SNIFF_RESPONSES.push((rid, bytes));
                      if SNIFF_RESPONSES.len() > SNIFF_MAX {
                          SNIFF_RESPONSES.remove(0);
                      }''','''                    let rid = if PENDING_RESPONSE_IDS.is_empty() { PENDING_REQ_ID } else { PENDING_RESPONSE_IDS.remove(0) };
                      let response_url = SNIFF_REQUESTS.iter().rev().find(|(id, _, _, _)| *id == rid)
                          .map(|(_, url, _, _)| url.clone()).unwrap_or_default();
                      push_sniff_metadata(rid, "response", &response_url, bytes.len());
                      SNIFF_RESPONSES.push((rid, bytes));
                      if SNIFF_RESPONSES.len() > SNIFF_RAW_MAX { SNIFF_RESPONSES.remove(0); }''')
          once('''                SNIFF_REQUESTS.push((rid, url_str, headers_json, body));
                      if SNIFF_REQUESTS.len() > SNIFF_MAX {
                          SNIFF_REQUESTS.remove(0);
                      }''','''                push_sniff_metadata(rid, "request", &url_str, body.len());
                      PENDING_RESPONSE_IDS.push(rid);
                      SNIFF_REQUESTS.push((rid, url_str, headers_json, body));
                      if SNIFF_REQUESTS.len() > SNIFF_RAW_MAX { SNIFF_REQUESTS.remove(0); }''')
          s=s.replace('"/api/sniff","/api/sniff/toggle","/api/sniff/clear","/api/sniff/diag"',
                      '"/api/sniff","/api/sniff/metadata","/api/sniff/status","/api/sniff/toggle","/api/sniff/clear","/api/sniff/diag"')
          p.write_text(s)
          p=Path('hachimi_ura_plugin/Cargo.toml'); s=p.read_text()
          import re
          s,n=re.subn(r'(?m)^version = "[^"]+"', 'version = "3.25.0"', s, count=1)
          if n != 1: raise SystemExit('Cargo version not found')
          p.write_text(s)
          PY
          rm -f docs/sniff-source-context.md
      - name: Format generated Rust
        working-directory: hachimi_ura_plugin
        run: cargo fmt
      - name: Commit upgrade
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: add long-session incremental sniff metadata'
          git push origin HEAD:workbench/sniff-long-capture
