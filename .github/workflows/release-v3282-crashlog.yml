name: Release v3.28.2 Crash Log Path Fix (baseline v3.28.0)
# Replays the exact v3.28.0 chain, pinned to the v3.28.0 release commit, then
# applies the crash-log path fix. No anim_skip, no version-single-source
# rewrite — this is v3.28.0 plus one patch, so the A/B against v3.28.0 is clean.
on:
  workflow_dispatch:
  push:
    branches:
      - workbench/v3282-crashlog-fix
    paths:
      - .github/workflows/release-v3282-crashlog.yml
permissions:
  contents: write
env:
  BASELINE_SHA: 721c086220ea081523229d88623de5abddd97eaa
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Pin source to the v3.28.0 baseline commit
        run: |
          set -euo pipefail
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git checkout "$BASELINE_SHA" -- scripts hachimi_ura_plugin
          test -f scripts/apply_crash_log_path_fix.py
          test -f scripts/run_generated_succession_l_cumulative.py
          test -f scripts/apply_screen_mirror_frame_a.py
          grep -aFq 'const CRASH_LOG_PATH: &str = "/data/data/jp.pokemon.pokeuma/files/uma_predict.log";' hachimi_ura_plugin/src/lib.rs
          ! grep -aFq 'mod training_anim_skip;' hachimi_ura_plugin/src/lib.rs
          ! grep -aFq 'fn hl_crash_log_dir()' hachimi_ura_plugin/src/lib.rs
      - name: Generate and validate baseline 3.27.23
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('hachimi_ura_plugin/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text = text.replace('version = "3.27.11"', 'version = "3.27.23"', 1)
          cargo.write_text(text, encoding='utf-8')
          lock = Path('hachimi_ura_plugin/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          text = text.replace('name = "hachimi_ura"\nversion = "3.27.11"', 'name = "hachimi_ura"\nversion = "3.27.23"', 1)
          lock.write_text(text, encoding='utf-8')
          PY
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.23"
          grep -Fq 'version = "3.27.23"' hachimi_ura_plugin/Cargo.lock
          grep -Fq 'verified_ramen_upstream_semantics' hachimi_ura_plugin/src/lib.rs
      - name: Add SIGSEGV guard — rename first, then insert wrappers
        run: |
          set -euo pipefail
          apply_guard() {
            python3 - <<'PY'
          from pathlib import Path

          source = Path('hachimi_ura_plugin/src/lib.rs')
          text = source.read_text(encoding='utf-8')
          MARK = 'v3.27.23 sigsegv-guard'

          if 'fn hl_ptr_mapped(' in text:
              print('sigsegv_guard=already_applied')
              raise SystemExit(0)

          # v3 顺序：先改名，再插块。
          # （v2 教训：先插块会让 rename 锚点同时命中包装函数定义 → count=2）
          # 只锚函数签名行，不碰任何函数体（生成器函数体会漂移）。

          # ── 1) 原函数改名 _inner（此时文件里签名行必然唯一，count==1 断言）──
          renames = [
              ('unsafe fn read_obscured_int_at(obj: *const c_void, field_offset: i32) -> i32 {',
               'unsafe fn read_obscured_int_at_inner(obj: *const c_void, field_offset: i32) -> i32 {'),
              ('unsafe fn read_ptr_at(obj: *const c_void, field_offset: i32) -> *mut c_void {',
               'unsafe fn read_ptr_at_inner(obj: *const c_void, field_offset: i32) -> *mut c_void {'),
              ('unsafe fn read_int_at(obj: *const c_void, field_offset: i32) -> i32 {',
               'unsafe fn read_int_at_inner(obj: *const c_void, field_offset: i32) -> i32 {'),
          ]
          for old, new in renames:
              c = text.count(old)
              if c != 1:
                  raise RuntimeError(f'rename anchor count={c} (expect 1): {old[:60]}')
              text = text.replace(old, new, 1)

          # ── 2) helpers + 同名包装插在 read_obscured_int_at_inner 定义之前 ──
          anchor = 'unsafe fn read_obscured_int_at_inner(obj: *const c_void, field_offset: i32) -> i32 {'
          if text.count(anchor) != 1:
              raise RuntimeError(f'insert anchor count={text.count(anchor)} (expect 1)')

          block = '''// v3.27.23 sigsegv-guard: mapped-region validation for raw memory reads.
          // Root cause: read_summary dereferenced game objects already freed on
          // screen change (scenario/data-set swap), raising SIGSEGV -> 60s
          // recovery cooldown with empty trainings/ramen output. Any address
          // outside a currently-readable mapping is now read as null / -1.
          // Maps snapshot cached 2s; unreadable maps fail OPEN (never brick reads).
          // Original helpers renamed *_inner; same-name wrappers add the guard
          // without assuming anything about the original bodies.
          static HL_MAP_CACHE: std::sync::Mutex<Option<(u64, Vec<(usize, usize)>)>> =
              std::sync::Mutex::new(None);

          fn hl_parse_maps_readable() -> Vec<(usize, usize)> {
              let text = match std::fs::read_to_string("/proc/self/maps") {
                  Ok(t) => t,
                  Err(_) => return Vec::new(),
              };
              let mut out: Vec<(usize, usize)> = Vec::new();
              for line in text.lines() {
                  let range = match line.split_whitespace().next() {
                      Some(r) => r,
                      None => continue,
                  };
                  let perms = line.split_whitespace().nth(1).unwrap_or("");
                  if !perms.starts_with('r') {
                      continue;
                  }
                  let mut it = range.splitn(2, '-');
                  let s = match it.next() { Some(v) => v, None => continue };
                  let e = match it.next() { Some(v) => v, None => continue };
                  let s = usize::from_str_radix(s, 16).unwrap_or(0);
                  let e = usize::from_str_radix(e, 16).unwrap_or(0);
                  if e > s {
                      out.push((s, e));
                  }
              }
              out
          }

          fn hl_ptr_mapped(addr: usize) -> bool {
              if addr == 0 {
                  return false;
              }
              let now = std::time::SystemTime::now()
                  .duration_since(std::time::UNIX_EPOCH)
                  .map(|d| d.as_secs())
                  .unwrap_or(0);
              let mut cache = match HL_MAP_CACHE.lock() {
                  Ok(g) => g,
                  Err(poisoned) => poisoned.into_inner(),
              };
              let stale = match *cache {
                  Some((ts, _)) => now.saturating_sub(ts) >= 2,
                  None => true,
              };
              if stale {
                  *cache = Some((now, hl_parse_maps_readable()));
              }
              let regions = match cache.as_ref() {
                  Some((_, r)) => r,
                  None => return true,
              };
              if regions.is_empty() {
                  return true; // maps unreadable — fail open
              }
              let mut lo = 0usize;
              let mut hi = regions.len();
              while lo < hi {
                  let mid = (lo + hi) / 2;
                  let (s, e) = regions[mid];
                  if addr < s {
                      hi = mid;
                  } else if addr >= e {
                      lo = mid + 1;
                  } else {
                      return true;
                  }
              }
              false
          }

          // v3.27.23 sigsegv-guard wrapper: unmapped holder or returned pointer -> null
          unsafe fn read_ptr_at(obj: *const c_void, field_offset: i32) -> *mut c_void {
              if !hl_ptr_mapped(obj as usize) {
                  return std::ptr::null_mut();
              }
              let value = read_ptr_at_inner(obj, field_offset);
              if !value.is_null() && !hl_ptr_mapped(value as usize) {
                  return std::ptr::null_mut(); // freed/dangling pointer read as null
              }
              value
          }

          // v3.27.23 sigsegv-guard wrapper: unmapped holder -> -1
          unsafe fn read_obscured_int_at(obj: *const c_void, field_offset: i32) -> i32 {
              if !hl_ptr_mapped(obj as usize) {
                  return -1;
              }
              read_obscured_int_at_inner(obj, field_offset)
          }

          // v3.27.23 sigsegv-guard wrapper: unmapped holder -> -1
          unsafe fn read_int_at(obj: *const c_void, field_offset: i32) -> i32 {
              if !hl_ptr_mapped(obj as usize) {
                  return -1;
              }
              read_int_at_inner(obj, field_offset)
          }

          '''
          text = text.replace(anchor, block + anchor, 1)

          source.write_text(text, encoding='utf-8')
          print('sigsegv_guard=applied marker_count=%d' % text.count(MARK))
          PY
          }
          apply_guard
          FIRST_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          apply_guard
          SECOND_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST_SHA" = "$SECOND_SHA"

      - name: Apply screen mirror A-stage (v3.28.0)
        run: |
          set -euo pipefail
          python3 scripts/apply_screen_mirror_frame_a.py
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.28.0"
          grep -Fq '// ===== Screen mirror frame A-stage (v3.28.0) =====' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'mirror_egl_swap_handler' hachimi_ura_plugin/src/lib.rs
          grep -Fq '"/api/frame"' hachimi_ura_plugin/src/lib.rs
          grep -Fq '"/api/touch"' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'install_screen_mirror_hook' hachimi_ura_plugin/src/lib.rs
      - name: Apply crash-log path fix (v3.28.2) + idempotency check
        run: |
          set -euo pipefail
          python3 scripts/apply_crash_log_path_fix.py
          FIRST_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          python3 scripts/apply_crash_log_path_fix.py
          SECOND_SHA=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST_SHA" = "$SECOND_SHA"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.28.2"
          grep -Fq 'version = "3.28.2"' hachimi_ura_plugin/Cargo.lock
      - name: Qualification greps (crash-log invariants)
        run: |
          set -euo pipefail
          for s in \
            'fn hl_crash_log_dir()' \
            'fn hl_crash_log_file()' \
            'fn hl_crash_log_init()' \
            'fn hl_crash_log_file_cstr()' \
            'let path = hl_crash_log_file_cstr();' \
            'hl_crash_log_init();' \
            'crash_log=' \
            'hl_ptr_mapped' \
            'mirror_egl_swap_handler'
          do grep -aFq "$s" hachimi_ura_plugin/src/lib.rs || { echo "MISSING INVARIANT: $s"; exit 1; }
          done
          if grep -aFq 'let path = b"/data/data/jp.pokemon.pokeuma' hachimi_ura_plugin/src/lib.rs; then
            echo "REGRESSION: signal handler still writes to the dead package path"; exit 1
          fi
          if grep -aFq 'mod training_anim_skip;' hachimi_ura_plugin/src/lib.rs; then
            echo "REGRESSION: anim_skip leaked into the v3.28.0 baseline"; exit 1
          fi
      - name: Setup Rust
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true
      - name: Build Android arm64 release
        id: cargo
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: set -o pipefail; cargo build --target aarch64-linux-android --release 2>&1 | tee release-v3282-cargo.log
      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          cargo_version=3.28.2
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.28.2
          workflow_run=${GITHUB_RUN_ID}
          baseline=v3.28.0(${BASELINE_SHA})+cumulative_3.27.23+sigsegv_guard+screen_mirror_frame_a
          features=crash_log_path_fix,screen_mirror_frame_a,egl_swapbuffers_hook,bmp_frame_channel,touch_receive_log,sigsegv_guard
          excluded=training_anim_skip,version_single_source
          runtime_validation=pending_device_execution
          EOF
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          gh release create "v3.28.2" "$ASSET" SHA256SUMS BUILD-MANIFEST.txt hachimi_ura_plugin/release-v3282-cargo.log \
            --title "v3.28.2 崩溃日志落盘修复（基线 v3.28.0）" \
            --notes "基线严格等于 v3.28.0（pin 到 721c086，含 cumulative 3.27.23 + SIGSEGV guard + 画面映射 A 阶段），只额外打一个补丁：崩溃日志路径。

根因：插件所有崩溃落盘点写的是 /data/data/jp.pokemon.pokeuma/files/uma_predict.log，而这个包名在机上根本不存在（真实包名从 /proc/self/cmdline 读到，是 jp.co.cygames.umamusume）。open 一直失败 → crash_signal_handler 的 CRASH at step/sig、panic hook 记录、predict step、自动上传全部静默丢失，所以育成第五回合那次闪退什么都没留下。

修复：崩溃日志改写 /sdcard/Android/media/<pkg>/hachimi/uma_predict.log（与 ura_boot.log 同目录，已证明可写、无需任何权限），旧路径保留为兜底；信号处理函数用的是启动时预热好的静态缓冲区，处理崩溃时不分配内存（async-signal-safe）。/debug/crashlog 现在会合并读取三个落点。

不含 training_anim_skip（v3.28.1 的头号嫌疑），也不含 version_single_source —— 所以端点里的 version 字段仍会显示旧值 3.22.91，这是已知现象不是回归；认这个包请看 ura_boot.log 新增的 crash_log= 那一行。"
