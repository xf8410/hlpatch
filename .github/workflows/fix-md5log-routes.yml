name: Fix md5log routes
on:
  workflow_dispatch:
  push:
    branches: [workbench/fix-md5log-routes]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/fix-md5log-routes
      - name: Apply fix
        shell: bash
        run: |
          python3 .github/scripts/fix_md5log_routes.py
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions-bot
          git config user.email actions@github.com
          git add hachimi_ura_plugin/src/lib.rs
          git commit -m 'fix md5log diagnostic routes'
          git push origin HEAD:workbench/fix-md5log-routes
