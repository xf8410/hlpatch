name: Capture failed sniff run
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [.github/workflows/capture-failed-sniff-run.yml]
permissions:
  actions: read
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/sniff-v2
      - name: Read failed run log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run view 30575147444 --repo xf8410/hlpatch --log-failed > /tmp/failed.log 2>&1
          status=$?
          {
            echo '# Failed sniff v2 workflow log'
            echo
            echo "gh_status=$status"
            echo '```text'
            tail -c 30000 /tmp/failed.log
            echo '```'
          } > docs/sniff-v2-failed-run.md
      - name: Commit log
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/sniff-v2-failed-run.md
          git commit -m 'docs: capture failed sniff v2 run log' || true
          git push origin HEAD:workbench/sniff-v2
