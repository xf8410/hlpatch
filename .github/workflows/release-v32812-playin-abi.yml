name: Release v3.28.12 playin ABI fix

# v3.28.11 hotfix: factor-badge detours returned usize (x0) but
# PlayInFactorList returns a 16-byte UniTask in x0:x1 — x1 was garbage and
# the result screen's async continuation SIGSEGVed on entering 育成 with a
# pending result. Detours now return u128 (x0:x1).
# Chain otherwise identical to v3.28.11 (3.28.2 lineage + badge + url_decode
# UTF-8 fix). Toolchain pinned by rust-toolchain.toml (1.97.1).
# Trigger: one-shot push on this file. Refuse-overwrite guard keeps re-fires safe.

on:
  workflow_dispatch:
  push:
    branches:
      - workbench/playin-abi-fix
    paths:
      - .github/workflows/release-v32812-playin-abi.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.28.12 >/dev/null 2>&1; then
            echo 'v3.28.12 release already exists — refusing to overwrite'
            exit 1
          fi

      - name: Generate chain + badge (u128 ABI) + url_decode patch
        run: |
          set -euo pipefail
          python3 scripts/run_generated_succession_l_cumulative.py
          python3 scripts/bump_plugin_version.py 3.27.23
          python3 scripts/apply_sigsegv_guard_v32723.py
          python3 scripts/apply_screen_mirror_frame_a.py
          python3 scripts/apply_factor_index_badge.py
          python3 scripts/apply_url_decode_utf8_fix.py
          python3 scripts/bump_plugin_version.py 3.28.12
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.28.12"
          grep -Fq 'version = "3.28.12"' hachimi_ura_plugin/Cargo.lock

      - name: Idempotency check (double apply => identical sha)
        run: |
          set -euo pipefail
          FIRST=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          python3 scripts/apply_factor_index_badge.py
          python3 scripts/apply_url_decode_utf8_fix.py
          SECOND=$(sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1)
          test "$FIRST" = "$SECOND"

      - name: Qualification greps (u128 ABI + badge + utf8 fix + invariants)
        run: |
          set -euo pipefail
          SRC=hachimi_ura_plugin/src/lib.rs
          MOD=hachimi_ura_plugin/src/factor_index_badge.rs
          for s in \
            'mod factor_index_badge;' \
            '"/api/factor_index"' \
            'install_screen_mirror_hook' \
            'fn hl_ptr_mapped(' \
            'String::from_utf8_lossy(&out).into_owned()'
          do grep -aFq "$s" "$SRC" || { echo "MISSING INVARIANT: $s"; exit 1; }
          done
          test "$(grep -aFc 'factor_index_badge::install();' "$SRC")" = "3"
          grep -aFq '/sdcard/Android/media/jp.co.cygames.umamusume/hachimi/uma_predict.log' "$SRC"
          ! grep -aFq 'jp.pokemon.pokeuma/files/uma_predict.log' "$SRC"
          ! grep -aFq 'result.push(n as char)' "$SRC"
          ! grep -aFq 'result.push(bytes[i] as char)' "$SRC"
          grep -aFq 'fn(*mut c_void, usize, usize, usize) -> u128' "$MOD"
          ! grep -aFq 'fn(*mut c_void, usize, usize, usize) -> usize' "$MOD"

      - name: Setup Rust (toolchain pinned by rust-toolchain.toml)
        run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release (3.28.2-era, no locked flag)
        id: cargo
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: set -o pipefail; cargo build --target aarch64-linux-android --release 2>&1 | tee release-v32812-cargo.log

      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=${GITHUB_SHA}
          cargo_version=3.28.12
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.28.12
          workflow_run=${GITHUB_RUN_ID}
          baseline=v3.28.2_lineage(cumulative+3.27.23+sigsegv_guard+screen_mirror_a+crashlog_media_path)
          features=factor_index_badge_playin_dual_hook_u128abi,url_decode_utf8_fix,screen_mirror_frame_a,sigsegv_guard
          toolchain=rust-1.97.1-pinned
          runtime_validation=pending_device_execution
          EOF
          cat BUILD-MANIFEST.txt

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          gh release create "v3.28.12" "$ASSET" SHA256SUMS BUILD-MANIFEST.txt hachimi_ura_plugin/release-v32812-cargo.log \
            --title "v3.28.12 修v3.28.11进育成闪退（playin hook ABI）" \
            --notes "热修：v3.28.11 的因子序号 detour 返回 usize（只占 x0），而 PlayInFactorList 返回 16 字节 UniTask（AAPCS64 走 x0:x1）——x1 是脏值，结算画面异步一消费就 SIGSEGV，表现为带着待结算存档点进育成即闪退。本版 detour 改返回 u128（x0:x1 全带）。其余同 v3.28.11：因子序号双 hook + url_decode UTF-8 修复。工具链钉 Rust 1.97.1。SHA256 见 SHA256SUMS。"
