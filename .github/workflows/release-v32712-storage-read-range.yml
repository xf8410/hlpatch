name: Release v3.27.12 Storage Read Range

on:
  push:
    branches:
      - workbench/next-generation-so-foundation-20260808
    paths:
      - .github/workflows/release-v32712-storage-read-range.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1f674c6afdce86823a9786c114a526480fbef630
          fetch-depth: 0

      - name: Validate immutable A1 source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1f674c6afdce86823a9786c114a526480fbef630"
          python3 scripts/run_generated_succession_l_cumulative.py
          grep -Fq 'Observation storage raw range export A1' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'fn storage_read_range' hachimi_ura_plugin/src/lib.rs
          grep -Fq 'X-HLPATCH-Range-End-Exclusive' hachimi_ura_plugin/src/lib.rs
          grep -Fq "scripts/apply_storage_read_range_a1.py" scripts/run_generated_succession_l_cumulative.py
          python3 - <<'PY'
          from pathlib import Path
          cargo = Path('hachimi_ura_plugin/Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          text = text.replace('version = "3.27.11"', 'version = "3.27.12"', 1)
          cargo.write_text(text, encoding='utf-8')
          lock = Path('hachimi_ura_plugin/Cargo.lock')
          text = lock.read_text(encoding='utf-8')
          text = text.replace('name = "hachimi_ura"\nversion = "3.27.11"', 'name = "hachimi_ura"\nversion = "3.27.12"', 1)
          lock.write_text(text, encoding='utf-8')
          PY
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)" = "3.27.12"
          grep -Fq 'name = "hachimi_ura"' hachimi_ura_plugin/Cargo.lock
          grep -Fq 'version = "3.27.12"' hachimi_ura_plugin/Cargo.lock

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          HLPATCH_SOURCE_COMMIT: 1f674c6afdce86823a9786c114a526480fbef630
        run: |
          set -o pipefail
          cargo build --target aarch64-linux-android --release 2>&1 | tee release-v32712-cargo.log
          cargo build --locked --target aarch64-linux-android --release 2>&1 | tee -a release-v32712-cargo.log

      - name: Prepare immutable release assets
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=1f674c6afdce86823a9786c114a526480fbef630
          cargo_version=3.27.12
          binary_size=$SIZE
          binary_sha256=$SHA256
          tag=v3.27.12
          workflow_run=${GITHUB_RUN_ID}
          features=storage_read_range,raw_binary_range,stable_file_id,range_headers,zero_byte_file
          ci_qualification_run=31315339982
          runtime_validation=pending_device_execution
          EOF

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          gh release create v3.27.12 \
            --target 1f674c6afdce86823a9786c114a526480fbef630 \
            --title v3.27.12 \
            --notes "Adds /storage/read_range for raw binary range export by stable observation file_id, with explicit range metadata and zero-byte file handling. CI qualification: run 31315339982. Device runtime validation remains pending." \
            "$ASSET" SHA256SUMS BUILD-MANIFEST.txt

      - name: Verify published Release identity and assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          RELEASE_JSON=$(gh api repos/${GITHUB_REPOSITORY}/releases/tags/v3.27.12)
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.target_commitish')" = "1f674c6afdce86823a9786c114a526480fbef630"
          test "$(printf '%s' "$RELEASE_JSON" | jq '[.assets[] | select(.name == "libhachimi_ura.so")] | length')" = "1"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .size')" = "$SIZE"
          test "$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "libhachimi_ura.so") | .digest')" = "sha256:$SHA256"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libhachimi_ura-v3.27.12-run-${{ github.run_id }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            hachimi_ura_plugin/release-v32712-cargo.log
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: warn
