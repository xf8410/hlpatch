name: Build Unified Pre-release Correction F

on:
  push:
    branches:
      - workbench/unified-observation-endpoint-implementation-20260806
    paths:
      - "scripts/apply_unified_endpoint_f_pre_release_fix.py"
      - ".github/workflows/build-unified-pre-release-f.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pre-release-f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply cumulative A-F patches twice
        run: |
          set -o pipefail
          : > f-build-diagnostics.log
          for pass in 1 2; do
            {
              python3 scripts/apply_unified_endpoint_a_patch.py
              python3 scripts/apply_unified_endpoint_a_compile_fix.py
              python3 scripts/apply_unified_endpoint_b_storage_patch.py
              python3 scripts/apply_unified_endpoint_b_storage_compile_fix.py
              python3 scripts/apply_unified_endpoint_c_inherit_pair_patch.py
              python3 scripts/apply_unified_endpoint_d_selected_parent_patch.py
              python3 scripts/apply_unified_endpoint_e_runtime_correction.py
              python3 scripts/apply_unified_endpoint_f_pre_release_fix.py
              sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1 > source-$pass.sha
            } 2>&1 | tee -a f-build-diagnostics.log || exit 1
          done
          cmp source-1.sha source-2.sha 2>&1 | tee -a f-build-diagnostics.log

      - name: Persist failure diagnostics
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p docs
          cp f-build-diagnostics.log docs/UNIFIED_ENDPOINT_F_BUILD_DIAGNOSTICS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/UNIFIED_ENDPOINT_F_BUILD_DIAGNOSTICS.md
          git commit -m "chore: capture unified endpoint F diagnostics" || exit 0
          git push origin HEAD:workbench/unified-observation-endpoint-implementation-20260806

      - name: Static endpoint contract audit
        run: |
          set -euo pipefail
          SRC=hachimi_ura_plugin/src/lib.rs
          grep -Fq 'let card_id = read_obscured_int_at(chara_obj, 36); // _cardId' "$SRC"
          grep -Fq 'let chara_id = call_getter_int(chara_class, chara_obj, "get_CharaId");' "$SRC"
          grep -Fq '"card_id":{},"chara_id":{}' "$SRC"
          grep -Fq 'method_index_status_endpoint' "$SRC"
          grep -Fq 'hlpatch-method-index-' "$SRC"
          grep -Fq 'persist_protocol_capture("request"' "$SRC"
          grep -Fq 'persist_protocol_capture("response"' "$SRC"
          grep -Fq 'legacy_inherit_contract_unreliable' "$SRC"
          grep -Fq 'legacy_saddle_runtime_chain_unverified' "$SRC"
          grep -Fq '"runtime_validation":"executed"' "$SRC"
          grep -Fq '"error":"missing_type"' "$SRC"
          ! grep -Fq 'rows.filter_map(Result::ok)' "$SRC"
          ! grep -Fq '"runtime_validation":"pending_device_execution"' "$SRC"

      - name: JSON format-string structural audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          s = Path('hachimi_ura_plugin/src/lib.rs').read_text()
          for fragment in ['"card_id":{},"chara_id":{}','"ok":false,"status":"deprecated"','"ok":false,"status":"unavailable"','"ok":true,"status":"{}","generation":{}']:
              assert fragment in s, fragment
          for sample in ['{"ok":false,"status":"deprecated","error":"legacy_inherit_contract_unreliable","replacement":"/inherit/pair_compat and /inherit/selected_parent_runtime"}','{"ok":false,"status":"unavailable","error":"legacy_saddle_runtime_chain_unverified"}','{"ok":false,"error":"missing_type"}']:
              json.loads(sample)
          print('json_contract_audit=ok')
          PY

      - name: Audit data-loss logic in F changes
        run: |
          set -euo pipefail
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist|truncate|preview' scripts/apply_unified_endpoint_f_pre_release_fix.py
          grep -Fq 'headers.raw' scripts/apply_unified_endpoint_f_pre_release_fix.py
          grep -Fq 'payload.bin' scripts/apply_unified_endpoint_f_pre_release_fix.py

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --target aarch64-linux-android --release

      - name: Generate build manifest
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$(git rev-parse HEAD)
          cargo_version=$VERSION
          binary_size=$SIZE
          binary_sha256=$SHA256
          workflow_run=${GITHUB_RUN_ID}
          build_kind=artifact_only
          endpoint_stage=F-pre-release-correction
          cumulative_patches=A,B,C,D,E,F
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-pre-release-f-${{ github.sha }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
