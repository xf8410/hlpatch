name: Audit Parent Multi-source I

on:
  push:
    branches:
      - workbench/unified-observation-endpoint-implementation-20260806
    paths:
      - ".github/workflows/audit-parent-multisource-i.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-parent-multisource-i:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract exact helper and endpoint source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hachimi_ura_plugin/src/lib.rs').read_text()
          targets=[
            'unsafe fn call_getter_ref',
            'unsafe fn call_getter_int',
            'unsafe fn call_getter_obscured_int',
            'unsafe fn call_getter_bool',
            'unsafe fn find_exact_instance_method',
            'unsafe fn invoke_parent_store_get',
            'unsafe fn selected_parent_record_json',
            'unsafe fn inherit_selected_parent_records_endpoint',
          ]
          lines=s.splitlines()
          out=['# Parent multi-source I exact runtime helpers','']
          for target in targets:
              matches=[i for i,line in enumerate(lines) if target in line]
              out += [f'## `{target}`','',f'match_count={len(matches)}','']
              for i in matches:
                  depth=0; started=False; end=min(len(lines), i+260)
                  block=[]
                  for j in range(i,end):
                      line=lines[j]; block.append(line)
                      depth += line.count('{')-line.count('}')
                      if '{' in line: started=True
                      if started and depth==0: break
                  out += ['```rust',*block,'```','']
          Path('docs/PARENT_MULTISOURCE_I_RUNTIME_AUDIT.md').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit audit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PARENT_MULTISOURCE_I_RUNTIME_AUDIT.md
          git commit -m "docs: capture parent multi-source runtime helper audit" || exit 0
          git push origin HEAD:workbench/unified-observation-endpoint-implementation-20260806
