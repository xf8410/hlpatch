name: Run isolated md5log workbench patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/fix-md5log-hooks
      - name: Extract and run reviewed patch
        run: |
          set -euo pipefail
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY[[:space:]]*$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/patch-md5log-workbench.yml > /tmp/patch.py
          test -s /tmp/patch.py
          python3 /tmp/patch.py
      - name: Validate
        working-directory: hachimi_ura_plugin
        run: |
          cargo fmt
          cargo check --locked
      - name: Commit source to workbench branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hachimi_ura_plugin/src/lib.rs
          git commit -m "fix: make md5log observable and hook concrete MD5 HashCore"
          git push origin HEAD:workbench/fix-md5log-hooks
