name: Run isolated md5log workbench patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: workbench/fix-md5log-hooks
      - name: Extract and run reviewed patch
        id: patch
        continue-on-error: true
        run: |
          set -uo pipefail
          awk '
            /python3 - <<'"'"'PY'"'"'/ { capture=1; next }
            capture && /^[[:space:]]*PY[[:space:]]*$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/patch-md5log-workbench.yml > /tmp/patch.py
          python3 /tmp/patch.py > /tmp/patch.log 2>&1
          rc=$?
          cat /tmp/patch.log
          if [ $rc -ne 0 ]; then
            cp /tmp/patch.log md5log_patch_error.txt
            exit $rc
          fi
      - name: Persist patch failure diagnostic
        if: steps.patch.outcome == 'failure'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add md5log_patch_error.txt
          git commit -m "diagnostic: record md5log patch failure"
          git push origin HEAD:workbench/fix-md5log-hooks
      - name: Validate
        if: steps.patch.outcome == 'success'
        working-directory: hachimi_ura_plugin
        run: |
          cargo fmt
          cargo check --locked
      - name: Commit source to workbench branch
        if: steps.patch.outcome == 'success'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add hachimi_ura_plugin/src/lib.rs
          git commit -m "fix: make md5log observable and hook concrete MD5 HashCore"
          git push origin HEAD:workbench/fix-md5log-hooks
