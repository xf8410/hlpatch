name: Diagnose storage read_range A1

on:
  push:
    branches:
      - workbench/next-generation-so-foundation-20260808
    paths:
      - ".github/workflows/diagnose-storage-read-range-a1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce cumulative A1 integration
        id: reproduce
        continue-on-error: true
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_generated_succession_l_cumulative.py')
          text = path.read_text(encoding='utf-8')
          invocation = "    subprocess.run(['python3','scripts/apply_storage_read_range_a1.py'],check=True)\n"
          anchor = "    apply_next_generation_foundation()\n"
          if invocation not in text:
              if text.count(anchor) != 1:
                  raise RuntimeError(f'cumulative anchor count={text.count(anchor)}')
              path.write_text(text.replace(anchor, anchor + invocation, 1), encoding='utf-8')
          PY
          python3 scripts/run_generated_succession_l_cumulative.py 2>&1 | tee a1-integration.log

      - name: Persist exact failure
        if: steps.reproduce.outcome == 'failure'
        run: |
          set -euo pipefail
          {
            echo '# Storage read_range A1 integration diagnostics'
            echo
            echo '```text'
            cat a1-integration.log
            echo '```'
          } > docs/STORAGE_READ_RANGE_A1_DIAGNOSTICS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/STORAGE_READ_RANGE_A1_DIAGNOSTICS.md
          git commit -m "chore: capture A1 cumulative integration failure"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Require reproduced command success
        if: steps.reproduce.outcome != 'success'
        run: exit 1
