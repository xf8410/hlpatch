name: Build Unified Response Headers H

on:
  push:
    branches:
      - workbench/unified-observation-endpoint-implementation-20260806
    paths:
      - "scripts/apply_unified_endpoint_h_response_headers.py"
      - ".github/workflows/build-unified-response-headers-h.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-response-headers-h:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply cumulative A-H twice
        run: |
          set -o pipefail
          : > h-build-diagnostics.log
          python3 scripts/fix_unified_endpoint_f_patch_anchors.py
          for pass in 1 2; do
            {
              python3 scripts/apply_unified_endpoint_a_patch.py
              python3 scripts/apply_unified_endpoint_a_compile_fix.py
              python3 scripts/apply_unified_endpoint_b_storage_patch.py
              python3 scripts/apply_unified_endpoint_b_storage_compile_fix.py
              python3 scripts/apply_unified_endpoint_c_inherit_pair_patch.py
              python3 scripts/apply_unified_endpoint_d_selected_parent_patch.py
              python3 scripts/apply_unified_endpoint_e_runtime_correction.py
              python3 scripts/apply_unified_endpoint_f_pre_release_fix.py
              python3 scripts/apply_unified_endpoint_g_release_gate_fix.py
              python3 scripts/apply_unified_endpoint_h_response_headers.py
              sha256sum hachimi_ura_plugin/src/lib.rs | cut -d' ' -f1 > source-$pass.sha
            } 2>&1 | tee -a h-build-diagnostics.log || exit 1
          done
          cmp source-1.sha source-2.sha 2>&1 | tee -a h-build-diagnostics.log

      - name: Static response-header contract audit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('hachimi_ura_plugin/src/lib.rs').read_text()
          required=[
            'UNITY_COMPLETE_ADDR', 'InvokeCompletionEvent',
            'observe_unity_response_completion', 'GetResponseHeaders',
            'take_unity_response_headers(&response_url)',
            'persist_protocol_capture("response", rid, &response_url, headers_json.as_bytes(), &bytes)',
            'storage_set_error("response_headers_not_correlated")',
          ]
          missing=[item for item in required if item not in s]
          assert not missing, missing
          assert 'push_sniff_metadata(rid, "response", &response_url, bytes.len(), &bytes, Vec::new());\n                if let Err(error) = persist_protocol_capture("response", rid, &response_url, &[], &bytes)' not in s
          print('response_header_contract_audit=ok')
          PY

      - name: Audit H data preservation
        run: |
          set -euo pipefail
          ! grep -Ein 'redact|mask|sanitize|scrub|metadata_only|denylist|allowlist|truncate|preview' scripts/apply_unified_endpoint_h_response_headers.py

      - name: Setup Rust
        run: rustup target add aarch64-linux-android

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26c
          link-to-sdk: true

      - name: Build Android arm64 release
        working-directory: hachimi_ura_plugin
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CC_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CXX_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          AR_aarch64_linux_android: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: cargo build --target aarch64-linux-android --release 2>&1 | tee ../h-build-diagnostics.log

      - name: Persist diagnostics
        if: failure()
        run: |
          set -euo pipefail
          cp h-build-diagnostics.log docs/UNIFIED_ENDPOINT_H_BUILD_DIAGNOSTICS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/UNIFIED_ENDPOINT_H_BUILD_DIAGNOSTICS.md
          git commit -m "chore: capture unified endpoint H diagnostics" || exit 0
          git push origin HEAD:workbench/unified-observation-endpoint-implementation-20260806

      - name: Generate manifest
        run: |
          set -euo pipefail
          ASSET=hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
          test -s "$ASSET"
          SHA256=$(sha256sum "$ASSET" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$ASSET")
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' hachimi_ura_plugin/Cargo.toml | head -1)
          printf '%s  %s\n' "$SHA256" libhachimi_ura.so > SHA256SUMS
          cat > BUILD-MANIFEST.txt <<EOF
          source_commit=$(git rev-parse HEAD)
          cargo_version=$VERSION
          binary_size=$SIZE
          binary_sha256=$SHA256
          workflow_run=${GITHUB_RUN_ID}
          build_kind=artifact_only
          endpoint_stage=H-response-headers
          cumulative_patches=A,B,C,D,E,F,G,H
          response_headers_capture=unity_async_completion_get_response_headers
          response_headers_missing_behavior=explicit_storage_error_response_headers_not_correlated
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: libhachimi_ura-response-headers-h-${{ github.sha }}
          path: |
            hachimi_ura_plugin/target/aarch64-linux-android/release/libhachimi_ura.so
            SHA256SUMS
            BUILD-MANIFEST.txt
          if-no-files-found: error
